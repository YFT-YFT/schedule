/* ================= shared project folder (File System Access API) ================= */
const SESSION=uid();
const SH={dir:null,name:'',user:'',on:false,base:{},last:{},meta:{},mtime:{},conflicts:{},locks:{},override:{},status:'',err:'',lastSync:0,busy:false,queue:false,lockKey:null,syncT:0,timer:0,lockT:0,fresh:0};
const SH_FRESH=150000;      // a lock is "fresh" for 150 s after its last heartbeat
const SH_POLL=30000;        // poll the folder every 30 s
const shSupported=()=>typeof window.showDirectoryPicker==='function';
const shUser=()=>SH.user||localStorage.getItem('kp_user')||'';
const keyFile=k=>{const [g,c]=k.split('|');return `${g}~${encodeURIComponent(c)}.json`};
const fileKey=n=>{const m=/^(\d+)~(.+)\.json$/.exec(n);return m?`${m[1]}|${decodeURIComponent(m[2])}`:null};
const partFile=part=>part==='project'?['project.json']:part==='roster'?['roster.json']:['classes',keyFile(part.slice(6))];

/* ---- (de)serialisation of the three kinds of part ---- */
function serPart(part){
  if(part==='project'){const o={};for(const k of ['v','id','title','meta','sched','opt','auto','form','imp','tpl','vari','printedAt'])o[k]=P[k];return JSON.stringify(o)}
  if(part==='roster')return JSON.stringify({students:P.students.map(s=>({id:s.id,g:s.g,c:s.c,n:s.n,name:s.name,kana:s.kana||'',addr:s.addr||'',sex:s.sex||''})),classes:Object.fromEntries(Object.entries(P.classes).map(([k,c])=>[k,{g:c.g,c:c.c,teacher:c.teacher||''}]))});
  const key=part.slice(6),c=P.classes[key];if(!c)return null;
  return JSON.stringify({key,g:c.g,c:c.c,locked:!!c.locked,grid:c.grid,students:members(key).map(s=>({id:s.id,cond:s.cond,ok:!!s.ok,slots:s.slots,sib:s.sib||[],memo:s.memo||''}))});
}
function applyPart(part,d){
  if(part==='project'){const def=newProject();for(const k of Object.keys(d))P[k]=d[k];P.meta=Object.assign(def.meta,P.meta);P.sched=Object.assign(def.sched,P.sched);P.opt=Object.assign(def.opt,P.opt);P.auto=Object.assign(def.auto,P.auto);P.form=Object.assign(def.form,P.form);P.tpl=P.tpl||{};return}
  if(part==='roster'){
    const byId=new Map(P.students.map(s=>[s.id,s])),next=[];
    for(const r of d.students){let s=byId.get(r.id);if(s)Object.assign(s,{g:r.g,c:r.c,n:r.n,name:r.name,kana:r.kana,addr:r.addr,sex:r.sex});else s={id:r.id,g:r.g,c:r.c,n:r.n,name:r.name,kana:r.kana,addr:r.addr,sex:r.sex,sib:[],cond:{},slots:1,ok:false,memo:''};next.push(s)}
    P.students=next;
    for(const k of Object.keys(d.classes)){const o=d.classes[k];if(!P.classes[k])P.classes[k]={g:o.g,c:o.c,teacher:'',locked:false,grid:{},slots:1};P.classes[k].teacher=o.teacher}
    for(const k of Object.keys(P.classes))if(!d.classes[k])delete P.classes[k];
    return}
  const key=part.slice(6);let c=P.classes[key];if(!c)c=P.classes[key]={g:d.g,c:d.c,teacher:'',locked:false,grid:{},slots:1};
  c.grid=d.grid||{};c.locked=!!d.locked;const byId=new Map(P.students.map(s=>[s.id,s]));
  for(const e of d.students){const s=byId.get(e.id);if(s){s.cond=e.cond||{};s.ok=!!e.ok;s.slots=e.slots||1;s.sib=e.sib||[];s.memo=e.memo||''}}
}

/* ---- disk helpers ---- */
async function shHandle(path,create){let d=SH.dir;for(let i=0;i<path.length-1;i++)d=await d.getDirectoryHandle(path[i],{create});return d.getFileHandle(path[path.length-1],{create})}
async function shRead(part){
  try{const fh=await shHandle(partFile(part),false),f=await fh.getFile(),txt=await f.text();return{env:JSON.parse(txt),mtime:f.lastModified}}
  catch(e){if(e.name==='NotFoundError'||e.name==='TypeMismatchError')return null;throw e}
}
async function shWriteRaw(part,env){const fh=await shHandle(partFile(part),true),w=await fh.createWritable();await w.write(JSON.stringify(env));await w.close()}
async function shListClasses(){const out=[];try{const cd=await SH.dir.getDirectoryHandle('classes');for await(const [n] of cd.entries()){const k=fileKey(n);if(k)out.push('class:'+k)}}catch(e){}return out}
async function shWrite(part){
  const cur=serPart(part);if(cur==null)return false;
  const env={kp:1,part,rev:(SH.base[part]||0)+1,savedAt:Date.now(),by:shUser()||'（名前なし）',nonce:uid(),data:JSON.parse(cur)};
  await shWriteRaw(part,env);
  const back=await shRead(part);
  if(!back||back.env.nonce!==env.nonce){SH.conflicts[part]={remoteRev:back?back.env.rev:0,by:back?back.env.by:'',at:back?back.env.savedAt:0,why:'write'};return false}
  SH.base[part]=env.rev;SH.last[part]=cur;SH.meta[part]={rev:env.rev,by:env.by,at:env.savedAt};SH.mtime[part]=back.mtime;delete SH.conflicts[part];return true;
}
function shAcceptRemote(part,env,mtime){
  applyPart(part,env.data);SH.base[part]=env.rev;SH.meta[part]={rev:env.rev,by:env.by,at:env.savedAt};SH.mtime[part]=mtime;
}

/* ---- the sync pass ---- */
function shSchedule(){if(!SH.on)return;clearTimeout(SH.syncT);SH.syncT=setTimeout(()=>shSync(),1200)}
async function shSync(opt={}){
  if(!SH.on)return;if(SH.busy){SH.queue=true;return}
  SH.busy=true;SH.status='sync';paintShare();
  const changed=[];let wrote=0;
  try{
    const parts=['project','roster'];const local=classList().map(c=>'class:'+c.key);const disk=await shListClasses();
    for(const p of new Set([...local,...disk]))parts.push(p);
    let remoteApplied=false;
    for(const part of parts){
      const d=await shRead(part),cur=serPart(part),dirty=cur!==null&&cur!==SH.last[part];
      if(!d){if(cur!==null&&(dirty||SH.base[part]==null)){if(await shWrite(part))wrote++}continue}
      const rev=d.env.rev|0,base=SH.base[part];
      if(base==null){ // first contact with this part on disk
        if(cur===null||!dirty){shAcceptRemote(part,d.env,d.mtime);SH.last[part]=serPart(part);remoteApplied=true;changed.push(part)}
        else SH.conflicts[part]={remoteRev:rev,by:d.env.by,at:d.env.savedAt,why:'new'};
        continue}
      SH.meta[part]={rev,by:d.env.by,at:d.env.savedAt};
      if(SH.conflicts[part]){SH.mtime[part]=d.mtime;continue}
      if(rev!==base){
        if(!dirty){shAcceptRemote(part,d.env,d.mtime);SH.last[part]=serPart(part);remoteApplied=true;changed.push(part)}
        else SH.conflicts[part]={remoteRev:rev,by:d.env.by,at:d.env.savedAt,why:'remote'};
      }else if(dirty){if(await shWrite(part))wrote++}
    }
    await shReadLocks();
    if(remoteApplied){VER++;resetHistory();UI.cond.sid=UI.cond.sid&&stById(UI.cond.sid)?UI.cond.sid:null;
      const names=changed.filter(x=>x.startsWith('class:')).map(x=>{const c=P.classes[x.slice(6)];return c?clsLabel(c.g,c.c):''}).filter(Boolean);
      if(opt.quiet!==true)toast(`共有フォルダの更新を読み込みました${names.length?`（${names.slice(0,3).join('、')}${names.length>3?' ほか':''}）`:changed.includes('roster')?'（名簿）':changed.includes('project')?'（設定）':''}`,{ms:5200});
      saveNow();render()}
    SH.lastSync=Date.now();SH.status=Object.keys(SH.conflicts).length?'conflict':'ok';SH.err='';
  }catch(e){SH.status='error';SH.err=String(e&&e.message||e)}
  finally{SH.busy=false;if(SH.queue){SH.queue=false;setTimeout(()=>shSync(),400)}}
  paintShare();render();
}

/* ---- locks ("someone is editing this class") ---- */
async function shReadLocks(){
  const out={};
  try{const ld=await SH.dir.getDirectoryHandle('locks');
    for await(const [n,h] of ld.entries()){const k=fileKey(n);if(!k)continue;try{const f=await h.getFile(),o=JSON.parse(await f.text());out[k]=o}catch(e){}}}catch(e){}
  SH.locks=out;
}
const shLockOf=k=>{const l=SH.locks[k];if(!l||l.sid===SESSION)return null;if(Date.now()-l.at>SH_FRESH)return null;return l};
const shBlocked=k=>SH.on&&!SH.override[k]&&shLockOf(k);
async function shPutLock(k){
  try{const d=await SH.dir.getDirectoryHandle('locks',{create:true}),fh=await d.getFileHandle(keyFile(k),{create:true}),w=await fh.createWritable();

async function shConnectHandle(dir,mode){
  SH.dir=dir;SH.name=dir.name||'共有フォルダ';if(mode!=='merge'){SH.base={};SH.last={};SH.meta={};SH.mtime={}}SH.conflicts={};SH.locks={};SH.override={};
  let hasProject=false;try{await dir.getFileHandle('project.json');hasProject=true}catch(e){}
  if(mode==='auto')mode=hasProject?'load':'create';
  SH.on=true;
  if(mode==='load'&&hasProject){await makeBackup('共有フォルダを開く前');
    const parts=['project','roster',...await shListClasses()];
    P=newProject();P.students=[];P.classes={};
    for(const part of parts){const d=await shRead(part);if(d){applyPart(part,d.env.data);SH.base[part]=d.env.rev;SH.meta[part]={rev:d.env.rev,by:d.env.by,at:d.env.savedAt};SH.mtime[part]=d.mtime}}
    P=migrate(P);for(const part of parts){SH.last[part]=serPart(part)}
    resetHistory();VER++;UI.cls=null;UI.cond.sid=null;UI.grid.sel=null;saveNow();
  }else{await shSync({quiet:true})}
  try{await dbSet(KEY_D,dir)}catch(e){}
  clearInterval(SH.timer);SH.timer=setInterval(()=>{shSync({quiet:false});if(SH.lockKey)shPutLock(SH.lockKey)},SH_POLL);
  await shSync({quiet:true});paintShare();render();
}

async function shAutoServer(){   // バッチ経由：フォルダを選ばずに自動でつながる
  try{const r=await fetch((SRV.base||'')+'/api/ping',{headers:{'X-KP-Token':SRV.token}});if(!r.ok)throw 0;const j=await r.json();SRV.name=j.name||'共有フォルダ'}
  catch(e){SRV=null;toast('中継プログラムにつながりません。「かこピタ起動.bat」から開き直してください',{kind:'warn',ms:9000});return}
  const dir=makeSrvDir();let env=null;
  try{const f=await (await dir.getFileHandle('project.json')).getFile();env=JSON.parse(await f.text())}catch(e){}
  if(!await shEnsureUser())return;
  if(env){const same=env.data&&env.data.id===P.id&&P.students.length>0;
    if(same)await shRestore(dir);else await shConnectHandle(dir,'load');
    toast(`共有フォルダにつながりました（${SRV.name}）`)}
  else toast('この共有フォルダには、まだ共有データがありません。名簿を読み込んでから、「共有する」で始めてください',{ms:8000});
}
async function shRestore(dirArg){ // after reload: try to reconnect to the saved folder
  try{const dir=dirArg||await dbGet(KEY_D);if(!dir)return;SH.dir=dir;SH.name=dir.name;SH.user=shUser();
    const p=dirArg?'granted':await dir.queryPermission({mode:'readwrite'});
    if(p==='granted'){SH.on=true;
      if(CM){clearInterval(SH.timer);SH.timer=setInterval(()=>{shSync({quiet:false});if(SH.lockKey)shPutLock(SH.lockKey)},SH_POLL);await shSync({quiet:true});paintShare();return}
      for(const part of ['project','roster',...classList().map(c=>'class:'+c.key)]){SH.last[part]=serPart(part)}
      // base revs are unknown after reload: read them from disk; treat our local copy as in sync unless the disk is newer
      for(const part of ['project','roster',...await shListClasses()]){const d=await shRead(part);if(d){SH.base[part]=d.env.rev;SH.meta[part]={rev:d.env.rev,by:d.env.by,at:d.env.savedAt};SH.mtime[part]=d.mtime;if(serPart(part)===null||d.env.rev>(SH.base[part]||0)){}}}
      // if the disk differs from local, load disk for clean parts
      clearInterval(SH.timer);SH.timer=setInterval(()=>{shSync({quiet:false});if(SH.lockKey)shPutLock(SH.lockKey)},SH_POLL);
      await shReloadClean();paintShare();
    }else{SH.on=false;SH.needGrant=true;paintShare()}
  }catch(e){}
}
async function shReloadClean(){ // after a reload we do not know what changed while we were away: take the disk version of every part we have not touched since
  const parts=['project','roster',...await shListClasses()];let any=false;
  for(const part of parts){const d=await shRead(part);if(!d)continue;
    const cur=serPart(part);
    // local cache (IndexedDB) may be older than disk. If it equals the last disk content we know nothing; prefer disk when its savedAt is newer than our project's updatedAt.
    if(d.env.savedAt>(P.updatedAt||0)){applyPart(part,d.env.data);any=true}
    SH.base[part]=d.env.rev;SH.last[part]=serPart(part);SH.meta[part]={rev:d.env.rev,by:d.env.by,at:d.env.savedAt};SH.mtime[part]=d.mtime}
  if(any){VER++;resetHistory();saveNow()}
  await shReadLocks();await shSync({quiet:true});
}
async function shGrant(){
  if(!SH.dir)return;try{const p=await SH.dir.requestPermission({mode:'readwrite'});if(p==='granted'){SH.on=true;SH.needGrant=false;clearInterval(SH.timer);SH.timer=setInterval(()=>{shSync({quiet:false});if(SH.lockKey)shPutLock(SH.lockKey)},SH_POLL);CM?await shSync({quiet:true}):await shReloadClean();toast('共有フォルダに再接続しました');render()}}catch(e){toast('再接続できませんでした')}
}

function buildClassHtml(key){
  const cpart='class:'+key,c=P.classes[key],now=Date.now();
  const env=(part,data,rev)=>({kp:1,part,rev,savedAt:now,by:shUser()||'',nonce:uid(),data});
  const ids=new Set(members(key).map(s=>s.id));                      // 個人情報を減らすため、その学級の児童生徒だけを入れる
  const ra=JSON.parse(serPart('roster')),roster={students:ra.students.filter(s=>ids.has(s.id)),classes:{[key]:ra.classes[key]}};
  const pj=JSON.parse(serPart('project'));pj.imp=null;
  const cd=serPart(cpart);
  const lastC=SH.last[cpart]!=null?SH.last[cpart]:(CM&&CM.last&&CM.last[cpart]!=null?CM.last[cpart]:cd);
  const revC=(SH.base[cpart]!=null?SH.base[cpart]:(CM?CM.snap.class.rev:0))|0;
  const boot={cls:key,name:clsLabel(c.g,c.c),pid:P.id,at:now,snap:{project:env('project',pj,0),roster:env('roster',roster,0),class:env(cpart,JSON.parse(cd),revC)},last:{[cpart]:lastC}};
  const mA='/*KP'+'B*/',mB='/*KP'+'E*/';
  let h=KP_SRC;const s0=h.indexOf('id="kp-boot"'),a=h.indexOf(mA,s0),b=h.indexOf(mB,a);
  if(s0<0||a<0||b<0)throw new Error('boot marker not found');
  const json=JSON.stringify(boot).replace(/</g,'\\u003c').replace(/\u2028/g,'\\u2028').replace(/\u2029/g,'\\u2029');
  h=h.slice(0,a)+mA+json+h.slice(b);
  h=h.replace(/<title>[^<]*<\/title>/,()=>`<title>かこピタ｜${esc(boot.name)}</title>`);
  return h;
}
async function genClassHtmls(keys,dir){
  let n=0;const out=[];
  for(const k of keys){const c=P.classes[k];if(!c)continue;const name=`${clsLabel(c.g,c.c)}.html`,html=buildClassHtml(k);
    if(dir){const fh=await dir.getFileHandle(name,{create:true}),w=await fh.createWritable();await w.write(html);await w.close()}else out.push([name,html]);n++}
  out.forEach(([name,html],i)=>setTimeout(()=>dlText(html,name),i*500));
  return n;
}

function exportClass(k){
  const part='class:'+k,cur=serPart(part);if(cur==null)return;
  const env={kp:1,part,rev:SH.base[part]||0,savedAt:Date.now(),by:shUser()||'',nonce:uid(),data:JSON.parse(cur)};
  const c=P.classes[k],b=new Blob([JSON.stringify(env)],{type:'application/json'}),a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download=`かこピタ_学級_${clsLabel(c.g,c.c)}_${todayISO()}.json`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
  toast(`${clsLabel(c.g,c.c)}のファイルを書き出しました`);
}
async function importClassFile(f){
  let env;try{env=JSON.parse(await f.text())}catch(e){toast('読み込めませんでした');return}
  if(!env||env.kp!==1||!/^class:/.test(env.part||'')){toast('学級ファイルではありません');return}
  const k=env.part.slice(6),c=P.classes[k];if(!c){toast('この学級は名簿にありません。先に名簿を読み込んでください');return}
  const cur=serPart(env.part),same=cur===JSON.stringify(env.data);
  if(same){toast('すでに同じ内容です');return}
  const meta=SH.meta[env.part],newer=meta&&meta.at>env.savedAt;
  const r=await ask({title:`${clsLabel(c.g,c.c)}の学級ファイルを取り込みます`,body:`<p>ファイルの保存者：<b>${esc(env.by||'不明')}</b>（${fullTs(env.savedAt)}）</p>${newer?`<div class="warnbox" style="margin-top:8px">共有フォルダには、これより新しい内容（${esc(meta.by)}、${fullTs(meta.at)}）があります。取り込むと、そちらを上書きします。</div>`:''}<p class="muted tiny" style="margin-top:8px">いまの内容は、バックアップに残してから置き換えます。</p>`,buttons:[{id:0,label:'やめる'},{id:1,label:'この内容に置き換える',kind:'pri'}]});
  if(r!==1)return;await makeBackup('学級ファイルの取り込み前');
  act(()=>{const keep=P.students.length;applyPart(env.part,env.data)});VER++;resetHistory();touch();toast(`${clsLabel(c.g,c.c)}を取り込みました`);
}

async function downloadApp(){

    if(!/かこピタ/.test(t))throw new Error('unexpected');
    const b=new Blob([t],{type:'text/html'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`かこピタ_v.${APP_VER}.html`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
    toast('ダウンロードしました。ファイルをダブルクリックすると、インターネットなしで使えます',{ms:7000});return true;
  }catch(e){toast('ダウンロードできませんでした。ブラウザの「名前を付けて保存」（Ctrl+S）でも保存できます',{ms:7000});return false}
}

 ['画面の使い方',()=>`<h3>1. 名簿</h3><p>Excel・CSV・貼り付けのどれでも取り込めます。列の順番は自由で、見出しがあれば自動で当てはめます。<b>担任名</b>も列として取り込めるほか、「担任名をまとめて設定」でも入力できます。住所は家庭訪問で近い家を続けたいときだけ入れてください（個人情報です）。</p>

 ['かこピタの設定',()=>`<h3>配置の方針（元のA列スイッチ）</h3><ul><li><b>シャッフル</b>：「固定」＝同じ条件なら同じ結果。「毎回ちがう」＝実行のたびに別案。納得いく案を選べます。</li><li><b>均等配置</b>：特定の日だけが過密になるのを防ぎます。</li><li><b>17:00努力</b>：まず17:00までで探し、だめなら17:00以降も使います。「厳守」も選べます。</li><li><b>詰める</b>：選んだ時刻に近い枠から使い、まとまった空き時間を作ります。</li><li><b>ハイライト</b>：選んだ児童生徒が入れない時間を、斜線で見せます（手動調整のミス防止）。</li></ul>
  <h3>きょうだい・住所への配慮</h3><ul><li><b>きょうだい配慮</b>：きょうだいが別の学級にいても、<b>同じ時刻にならない</b>ようにし、同じ日の近い時刻に寄せます。<b>間隔は「続けて」または「1〜2枠あける」から選べます</b>（既定は続けて）。</li><li><b>住所配慮</b>：住所の先頭◯文字が同じ（同じ地区）児童生徒を、同じ日に続けて配置します。余裕があるときは、離れていそうな地区（地区名が違う）どうしが隣り合わないよう、間に1枠あけます。<b>「住所が近い児童生徒を近くに配置する」は、行事が家庭訪問のときだけ最初からオンです</b>（ほかの行事では最初はオフ。チェックで切り替えられます）。</li></ul>`],
 ['便利な技',()=>`<ul><li><b>Ctrl+Z / Ctrl+Y</b>：取り消し／やり直し（配置・条件・名簿の取り込みなど、ほとんどの操作に効きます）</li><li><b>1・2・3・0 キー</b>（4. 条件）：ブラシを ×・○・未・消しゴム に切り替え</li><li><b>↑↓ キー</b>（4. 条件）：前後の児童生徒へ</li><li><b>選んでクリック</b>（5. かこピタ(配置)）：未配置の児童生徒を選び、置きたいマスをクリック。置いてある人を選んで別のマスをクリックすると、入れ替わります。</li><li><b>右クリック</b>（5. かこピタ(配置)）：置いた人を外す／空きマスを休憩（×）に</li><li><b>名前で探す</b>：条件・配置の画面の検索欄で、児童生徒を名前ですばやく探せます</li><li><b>Ctrl+S</b>：保存先ファイルへ保存（設定済みのとき）</li><li><b>休憩の予約</b>：「休憩（×）を置く」モードで空きマスをクリック。かこピタはそこを避けます。</li><li><b>枠数</b>：特別な支援や相談が必要な児童生徒に、連続した時間を確保できます。</li></ul>`],
 ['保存・共有・オフライン',()=>`<h3>保存</h3><p>編集のたびに、このブラウザの中へ自動保存されます。右上の保存表示から「保存先ファイル」を決めておくと、そのファイルにも自動で書き込みます（Chrome／Edge）。「以前の状態に戻す」で、自動バックアップ（12件）から戻せます。</p>
<h3>共有のしかた：プロジェクトフォルダ（全員が同じHTMLを開く）</h3><p>学年主任が、共有フォルダ（学校のサーバー、クラウドの同期フォルダなど）を選んで共有を始めます。学級ごとにファイルが作られ、<b>30秒ごとに最新を確認</b>します。ほかの人が編集中の学級には「◯◯さんが編集中」と表示され、見るだけの状態になります。同時に編集してしまったときは、どちらを使うか選べます。Chrome／Edge で使えます。それ以外では、「学級ファイルの書き出し・取り込み」をお使いください。</p>
  <h3>バッチで起動する（Windows・フォルダ選択が不要）</h3><p>「共有する」→「3つを共有フォルダに書き出す」で、共有フォルダに<b>かこピタ.html・かこピタ起動.bat・kakopita-server.ps1</b>ができます（書き出せないときはダウンロードして入れてください）。担任は<b>「かこピタ起動.bat」をダブルクリック</b>するだけです。担任のPCの中だけで動く小さな中継プログラムが起動し、ブラウザでかこピタが開いて、共有フォルダにつながります（フォルダ選択は不要）。作業中は、黒い窓を閉じないでください。閉じると、保存が共有フォルダに届かなくなります。かこピタを新しい版にするときは、共有フォルダの「かこピタ.html」を入れ替えます。</p>
  <p><b>職場でインターネットが別のブラウザ（リモートで隔離されたブラウザなど）に切り替わる場合：</b>バッチは、かこピタのHTMLを自分のPCの一時フォルダにコピーし、<b>ローカルのファイルとして</b>EdgeまたはChromeで開きます（インターネットのアドレスは開きません）。うまく開かないときは、黒い窓に表示される「file:///…」のアドレスを、自分のPCで動くブラウザに貼り付けてください。それも難しいときは、バッチを使わず、<b>「共有フォルダを選ぶ」の方式</b>（ネットワークを使わず、パソコンの中だけで動きます）をお使いください。</p>
  <h3>持ち出して作業するとき</h3><p>学級専用のHTMLは、1つのファイルの中にその学級のデータが入っています。USBなどで持ち出して自宅で作業し、「共有する」→「このHTMLを保存し直す」で更新したHTMLを持ち帰って、共有フォルダのHTMLと入れ替えます。開いてフォルダにつなぐと、サーバー側のほうが新しかった場合は、どちらを使うか確認します。</p>
  <h3>オフラインで使う</h3><p>このアプリは<b>1つのHTMLファイル</b>で、インターネットなしで動きます。名簿を扱う作業は、インターネットのない環境で行い、フォームを作るときだけ、インターネットにつないで「script.new」を開いてください。</p>
  <h3>データを消す（新しい行事を始めるとき）</h3><p>「設定」→「データを消す…」を押すと、消す内容を選べます。標準の「次の行事の準備」は、<b>名簿・担任名・学校情報・文面・設定は残し</b>、条件・配置・日程・取り込み履歴だけを消します。「名簿・担任名も消す」「すべて消す（初期化）」も、ボタンひとつで選べます。実行前に自動でバックアップを取るので、「元に戻す」で戻せます。</p>`],
 ['よくある質問',()=>`<h3>名簿との照合のしかたは？</h3><p>回答の<b>学年・組・ふりがな</b>で探します。同じふりがなの児童生徒が同じ学級にいるときだけ、<b>漢字</b>を確認し、漢字も同じ場合だけ<b>出席番号</b>まで確認します。そのため、保護者が出席番号や漢字を間違えても、電話での確認なしで取り込めます。自動で補正した件数と内訳は、取り込み前の確認画面に出ます。</p>
  <h3>同じ児童生徒が2回回答したら？</h3><p>タイムスタンプが最新の回答だけを使い、古いものは破棄します。</p>
  <h3>まだ回答がない児童生徒は？</h3><p>取り込み時に「未」になり、自動配置の対象外になります。「6. 印刷」の催促状で、お知らせを出せます。</p>
  <h3>名前の異体字が表示されない</h3><p>名前の表示には、異体字の多い文字を表示できるフォントを優先して使います（設定で、いつもの見やすいフォントに戻せます）。それでも「□」になる文字は、パソコンにそのフォントが入っていない可能性があります。無料の「IPAmj明朝」などをインストールすると表示されることがあります。</p>
  <h3>印刷前の点検は？</h3><p>「6. 印刷」の画面に、日時が決まっていない児童生徒、未回答、担任名・学校名・電話番号の空欄が出ます。</p>`],
 ['かこピタについて',()=>`<h3>【Origin】ツール名「かこピタ」に込めた想い</h3><p>「かこピタ」という名前は、学校現場の二大重労働である「家庭訪問（か）」と「懇談（こ）」から取られています。これらの業務で最も心身を削るのが「日程調整」というパズルです。数十人の保護者の希望を、パズルのピースを埋めるように調整し、かつ重複や漏れが許されない。この緻密な作業を、数学者ピタゴラスの定理のごとく、論理的かつ瞬時に解決したいという願いが込められています。</p><p>本ツールは、単なる効率化ではなく、担任が「児童生徒と向き合う時間」を取り戻すための聖域を作ることを目的として開発されました。「ピタッ！」と決まるその瞬間、パズルを解いた爽快感とともに、校務に新しい風が吹くことを確信しています。まさに、教育現場に数学的な美しさと、ゆとりをもたらすための校務DXの象徴です。</p>
  <h3>【The Solution】従来業務の苦悩 vs 「かこピタ」の革命</h3><p>従来、日程調整は「付箋」と「消しゴム」の戦いでした。保護者から提出された紙の山を前に、担任は深夜まで盤面を睨み、一人の変更があれば全員を並べ直すという、あまりにも非生産的なループを繰り返していました。これは教育者が行うべきクリエイティブな仕事ではありません。</p><p>「かこピタ」はこのプロセスを完全にデジタル化・自動化します。アンケート回答を読み込んだ瞬間、数万通りの組合せを計算し、最適な解を提示します。人がやれば数日かかる作業を数秒へ。この圧倒的な時間短縮こそが、教員の働き方改革の正体です。また、転記ミスやダブルブッキングといったヒューマンエラーをゼロにすることで、保護者との信頼関係維持にも大きく寄与します。精神的なプレッシャーからの解放は、翌日の授業の質を確実に向上させるでしょう。</p>
  <h3>【Compassion】かゆいところに手が届く、現場目線のディテール</h3><p>本ツールには、フジイヨウスケ氏の現場経験に基づく「魂のディテール」が宿っています。例えば、一覧表の児童生徒名をクリックするだけで、その子の都合へ移動できる機能。たったこれだけのことですが、45人の名簿を上下にスクロールするストレスを完全に消し去ります。また、17時以降の行表示トグルは、放課後勤務の有無に合わせて画面を最適化するための、静かな優しさです。これらは仕様書には現れにくいですが、実際に毎日使うユーザーにとって最も価値のある『配慮』という名の機能です。</p>
  <h3>【Credit】</h3><p>かこピタ v.${APP_VER}　Created by ${APP_AUTHOR} with Gemini ／ Special Thanks ウチムラヨウスケ<br>Web（HTML）版は、原作の機能と考え方を引き継いで移設したものです。</p>`]
];
A.help=(el0,e,tab=0)=>{
  const el=openDlg('',{wide:true}),box=$('.dlg',el);let cur=tab;
  const paint=()=>{box.innerHTML=`<h2>使い方</h2><div class="helpnav">${HELP.map((h,i)=>`<button class="btn sm ${i===cur?'pri':''}" data-hp="${i}">${h[0]}</button>`).join('')}</div><div class="helpbody" style="min-height:300px">${HELP[cur][1]()}</div><div class="acts"><button class="btn pri" data-close>閉じる</button></div>`};
  paint();el.addEventListener('click',e=>{if(e.target.closest('[data-close]')){el._close();return}const b=e.target.closest('[data-hp]');if(b){cur=+b.dataset.hp;paint();box.scrollTop=0}});
};

/* ---------- teachers: bulk set ---------- */
A.teachers=()=>{
  const cl=classList();
  const el=openDlg(`<h2>担任名をまとめて設定</h2><p class="muted tiny" style="margin-bottom:8px">1行に1学級。「学年　組　担任名」の形で、貼り付けるか書き換えてください（Excelの表からそのまま貼り付けられます）。<br>例：<code>1 1 青木</code>　<code>1年2組　池田</code>　<code>2-1,上野</code></p>
   <textarea class="paste" id="tchBox" style="min-height:220px">${cl.map(c=>`${c.g}年${c.c}組\t${c.teacher||''}`).join('\n')}</textarea>
   <div id="tchMsg" class="tiny muted" style="margin-top:6px"></div>
   <div class="acts"><button class="btn" data-close>やめる</button><button class="btn pri" data-tch="1">${ic('check',16)}この内容で設定する</button></div>`,{wide:true});
  el.addEventListener('click',e=>{
    if(e.target.closest('[data-close]')){el._close();return}
    if(!e.target.closest('[data-tch]'))return;
    const lines=$('#tchBox',el).value.split(/\r?\n/);let n=0;const unknown=[];
    act(()=>{for(const ln of lines){const m=/^\s*(\d+)\s*(?:年|[-\s,\t、])\s*([0-9A-Za-zＡ-Ｚ]+)\s*組?\s*[\t ,、:：]*\s*(.*?)\s*(?:先生|せんせい)?\s*$/.exec(ln.normalize('NFKC'));if(!m)continue;
      const k=`${+m[1]}|${/^\d+$/.test(m[2])?String(+m[2]):m[2]}`,c=P.classes[k];if(!c){unknown.push(ln.trim());continue}
      if((c.teacher||'')!==m[3]){setProp(c,'teacher',m[3]);n++}}});
    el._close();toast(`${n}学級の担任名を設定しました${unknown.length?`（名簿にない学級を除く：${unknown.slice(0,3).join('、')}）`:''}`,{undo:true});
  });
};

/* ---------- new event: clear ---------- */
A.newevent=()=>{
  const cl=classList(),sel=new Set(cl.map(c=>c.key));
  const items=[   // [キー, 表示名, 行事ごとに消す(true)/学校・名簿の情報(false)]
    ['cond','条件（×・○・未の入力）',true],['sib','きょうだい情報',true],['grid','配置（一覧表・休憩）',true],['sched','日程（日付）',true],['imp','フォームの取り込み履歴・印刷済みの記録',true],
    ['roster','名簿（児童生徒の全員）',false],['teacher','担任名',false],['meta','学校名・電話番号・行事の種類',false],['tpl','お知らせ・催促状の文面',false],['settings','かこピタの設定（配置の方針・フォーム設定・タイトルなど）',false]];
  const PRESET={prep:['cond','sib','grid','sched','imp'],roster:['cond','sib','grid','sched','imp','roster','teacher'],all:items.map(i=>i[0])};
  const st=Object.fromEntries(items.map(i=>[i[0],PRESET.prep.includes(i[0])]));
  const setPreset=p=>{items.forEach(i=>st[i[0]]=PRESET[p].includes(i[0]))};
  const el=openDlg('',{wide:true}),box=$('.dlg',el);
  const isAll=()=>items.every(i=>st[i[0]]);
  const paint=()=>{const cur=['prep','roster','all'].find(p=>PRESET[p].length===items.filter(i=>st[i[0]]).length&&PRESET[p].every(k=>st[k]));
    const row=(g)=>items.filter(i=>i[2]===g).map(([k,l])=>`<label class="tog"><input type="checkbox" data-nek="${k}" ${st[k]?'checked':''}>${l}${['roster','teacher','tpl','meta','settings','imp','sched'].includes(k)?' <span class="tiny muted">（全学級が対象）</span>':''}</label>`).join('');
    box.innerHTML=`<h2>データを消す</h2><p class="muted tiny" style="margin-bottom:10px">消す内容を選びます。実行前に自動でバックアップを取り、実行後も「元に戻す」で戻せます。</p>
     <div class="seg" style="margin-bottom:12px"><button data-ne="p-prep" class="${cur==='prep'?'on':''}">次の行事の準備（標準）</button><button data-ne="p-roster" class="${cur==='roster'?'on':''}">名簿・担任名も消す</button><button data-ne="p-all" class="${cur==='all'?'on':''}">すべて消す（初期化）</button></div>
     <div class="tiny muted" style="margin-bottom:10px">${cur==='prep'?'名簿・担任名・学校情報・文面・設定は残し、条件・配置・日程などだけを消します。次の行事を始めるときに便利です。':cur==='roster'?'学年が変わるときなどに。学校名・文面・設定は残ります。':cur==='all'?'名簿・日程・条件・配置・設定をすべて消して、最初の状態に戻します。':'自分で選んだ内容を消します。'}</div>
     <div style="font-weight:800;font-size:12.5px;color:var(--ink2);margin-bottom:4px">対象の学級（条件・配置・きょうだいを消す学級）</div><div class="cbar" style="margin-bottom:12px">${cl.map(c=>`<button class="cp ${sel.has(c.key)?'on':''}" style="${gStyle(c.g)}" data-ne="tog" data-k="${esc(c.key)}">${esc(clsLabel(c.g,c.c))}</button>`).join('')}<button class="btn ghost sm" data-ne="all">すべて</button><button class="btn ghost sm" data-ne="none">解除</button></div>
     <div style="font-weight:800;font-size:12.5px;color:var(--ink2);margin-bottom:4px">行事ごとのデータ</div><div style="display:flex;flex-direction:column;gap:6px;margin-bottom:10px">${row(true)}</div>
     <div style="font-weight:800;font-size:12.5px;color:var(--ink2);margin-bottom:4px">学校・名簿の情報（ふつうは残します）</div><div style="display:flex;flex-direction:column;gap:6px">${row(false)}</div>
     ${st.roster?'<div class="ngbox" style="margin-top:10px">名簿を消すと、条件・配置もすべてなくなります。</div>':''}
     <div class="acts"><button class="btn" data-close>やめる</button><button class="btn danger pri" data-ne="go">${ic('trash',16)}${isAll()?'すべて消す':'選んだ内容を消す'}</button></div>`};
  paint();
  el.addEventListener('change',e=>{const k=e.target.dataset.nek;if(k){st[k]=e.target.checked;paint()}});
  el.addEventListener('click',async e=>{
    if(e.target.closest('[data-close]')){el._close();return}
    const b=e.target.closest('[data-ne]');if(!b)return;const a=b.dataset.ne;
    if(a.startsWith('p-')){setPreset(a.slice(2));paint();return}
    if(a==='tog'){sel.has(b.dataset.k)?sel.delete(b.dataset.k):sel.add(b.dataset.k);paint();return}
    if(a==='all'){cl.forEach(c=>sel.add(c.key));paint();return}
    if(a==='none'){sel.clear();paint();return}
    if(a==='go'){
      if(!Object.values(st).some(Boolean)){toast('消す内容を選んでください');return}
      if(!sel.size&&(st.cond||st.sib||st.grid)){toast('対象の学級を選んでください');return}
      if(isAll()&&sel.size===cl.length){el._close();await makeBackup('すべて消す前');P=newProject();resetHistory();VER++;UI.cls=null;UI.cond.sid=null;UI.grid.sel=null;UI.snapped=false;go('home');touch();toast('すべて消しました。「元に戻す」または「以前の状態に戻す」で復元できます',{undo:true,ms:9000});return}
      el._close();await makeBackup('データを消す前');
      act(()=>{
        for(const s of P.students){const k=s.g+'|'+s.c;if(!sel.has(k))continue;
          if(st.cond){for(const kk of Object.keys(s.cond))delProp(s.cond,kk);setProp(s,'ok',false)}
          if(st.sib)setProp(s,'sib',[])}
        for(const k of sel){const c=P.classes[k];if(c&&st.grid){for(const kk of Object.keys(c.grid))delProp(c.grid,kk);setProp(c,'locked',false)}}
        if(st.sched)setProp(P.sched,'dates',[]);
        if(st.imp){setProp(P,'imp',null);setProp(P,'printedAt',0)}
        if(st.teacher)for(const k of Object.keys(P.classes))setProp(P.classes[k],'teacher','');
        if(st.tpl)setProp(P,'tpl',{});
        if(st.meta){setProp(P.meta,'school','');setProp(P.meta,'tel','');setProp(P.meta,'kind','三者懇談会')}
        if(st.settings){const d=newProject();setProp(P,'opt',d.opt);setProp(P,'auto',d.auto);setProp(P,'form',d.form);setProp(P,'title','')}
        if(st.roster){setProp(P,'students',[]);setProp(P,'classes',{})}
      });
      UI.cls=null;UI.cond.sid=null;UI.grid.sel=null;toast('消しました。「元に戻す」で戻せます',{undo:true,ms:8000});go('home');
    }
  });
};

/* ================= helpers ================= */
function vNeed(){
  const n=P.students.length;
  return `<div class="page"><div class="empty" style="margin-top:30px"><h3>${!n?'まず名簿を読み込みましょう':'先に日程を決めましょう'}</h3><p style="margin-bottom:14px">${!n?'児童生徒がいないため、この画面はまだ使えません。':'日付が1日もないため、時間割を作れません。'}</p><button class="btn pri" data-act="go" data-v="${!n?'roster':'schedule'}">${!n?'名簿を読み込む':'日程を決める'}</button></div></div>`;
}

async function placeAt(clsKey,sid,target){
  const cls=P.classes[clsKey],st=stById(sid);if(!st)return;
  let tk=target,tc=cls.grid[tk];
  if(tc&&tc.brk){toast('そこは休憩（×）です。「休憩を置く」モードで解除できます');return}
  if(tc&&tc.cont){tk=headKey(cls,tc.sid);tc=cls.grid[tk]}
  if(tc&&tc.sid===sid)return;
  const oldKey=headKey(cls,sid),other=tc&&tc.head?stById(tc.sid):null;
  const plan=[{st,k:tk}];
  if(other&&oldKey)plan.push({st:other,k:oldKey});
  const ign=new Set([sid]);if(other)ign.add(other.id);
  const used=new Set();
  for(const it of plan){
    const n=Math.max(1,+it.st.slots||1),keys=spanKeys(it.k,n);
    if(!keys){toast(`${it.st.name} さんは${n}枠必要ですが、そこでは時間割をはみ出します`);return}
    for(const kk of keys){if(!cellFree(cls,kk,ign)||used.has(kk)){toast(`${it.st.name} さんの${n}枠分が、他の児童生徒や休憩とぶつかるため置けません`);return}used.add(kk)}
    it.keys=keys;it.ng=isNG(it.st,keys);
  }
  let exc=false;
  const ngs=plan.filter(x=>x.ng);
  if(ngs.length){
    const r=await ask({title:'都合の悪い時間です',body:`<p>${ngs.map(x=>`<b>${esc(x.st.name)}</b> さん（${fmtD(x.keys[0].split('|')[0])} ${x.keys[0].split('|')[1].replace(/^0/,'')}）`).join('、')}は、入力された都合では入れない時間です。</p><p class="muted" style="margin-top:8px">どうしますか？</p>`,
      buttons:[{id:null,label:'取り消す'},{id:'exc',label:'例外として許可する'},{id:'keep',label:'赤色で残す',kind:'pri'}]});
    if(!r)return;exc=r==='exc';
  }
  act(()=>{
    for(const it of plan)clearPlace(cls,it.st.id);if(other&&!oldKey)clearPlace(cls,other.id);

}

  el.addEventListener('click',async e=>{

function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
async function sampleFlow(){

const AREAS=['みどり町1丁目','みどり町2丁目','さくら台','あおば通り','ひがし町','なかの町3丁目'];
function makeSample(){
  const r=rng(7),SN=[['佐藤','さとう'],['鈴木','すずき'],['高橋','たかはし'],['田中','たなか'],['伊藤','いとう'],['渡辺','わたなべ'],['山本','やまもと'],['中村','なかむら'],['小林','こばやし'],['加藤','かとう'],['吉田','よしだ'],['山田','やまだ'],['佐々木','ささき'],['山口','やまぐち'],['松本','まつもと'],['井上','いのうえ'],['木村','きむら'],['林','はやし'],['斎藤','さいとう'],['清水','しみず']],
   GN=[['太郎','たろう'],['花子','はなこ'],['翔','しょう'],['美咲','みさき'],['蓮','れん'],['結衣','ゆい'],['大輝','だいき'],['陽菜','ひな'],['悠斗','ゆうと'],['さくら','さくら'],['颯太','そうた'],['莉子','りこ'],['湊','みなと'],['心春','こはる'],['陸','りく'],['葵','あおい']];
  const p=newProject();p.title='サンプル：2学期 三者懇談会';p.meta.school='みらい中学校';p.meta.tel='06-0000-0000';
  let d=addDays(todayISO(),1);while(dp(d).wd!==1)d=addDays(d,1);
  p.sched.dates=[0,1,2,3,4].map(i=>addDays(d,i));
  const defs=[[1,'1',30,'青木'],[1,'2',29,'池田'],[2,'1',31,'上野']];
  for(const [g,c,n,t] of defs){p.classes[g+'|'+c]={g,c,teacher:t,locked:false,grid:{},slots:1};
    const used=new Set();for(let i=1;i<=n;i++){let a,b;do{a=SN[Math.floor(r()*SN.length)];b=GN[Math.floor(r()*GN.length)]}while(used.has(a[0]+b[0]));used.add(a[0]+b[0]);
      p.students.push({id:uid(),g,c,n:i,name:a[0]+' '+b[0],kana:a[1]+' '+b[1],addr:AREAS[Math.floor(r()*AREAS.length)]+(1+Math.floor(r()*9))+'-'+(1+Math.floor(r()*20)),sex:'',sib:[],cond:{},slots:r()<.1?2:1,ok:false,memo:''})}}
  const keys=[];for(const dd of p.sched.dates)for(let i=0;i<p.sched.slotCount;i++)keys.push([dd,keyT(840+i*20)]);
  for(const s of p.students){const x=r(),src=r()<.7?'i':'m';
    if(x<.06){for(const [dd,t] of keys)s.cond[dd+'|'+t]={v:'u',s:src}}
    else if(x<.2){const ds=p.sched.dates.slice().sort(()=>r()-.5).slice(0,2);for(const dd of ds){const st=Math.floor(r()*14);const len=3+Math.floor(r()*3);for(let i=st;i<st+len&&i<20;i++)s.cond[dd+'|'+keyT(840+i*20)]={v:'o',s:src}}}
    else if(x<.8){const ds=p.sched.dates.slice().sort(()=>r()-.5).slice(0,1+Math.floor(r()*3));for(const dd of ds){const st=Math.floor(r()*12);const len=r()<.4?20:3+Math.floor(r()*8);for(let i=r()<.3?0:st;i<st+len&&i<20;i++)s.cond[dd+'|'+keyT(840+i*20)]={v:'x',s:src}}}
    else s.ok=r()<.5}
  const a=p.students[3],b=p.students[33];a.sib=[{name:b.name,g:String(b.g),c:b.c,n:String(b.n),note:''}];b.sib=[{name:a.name,g:String(a.g),c:a.c,n:String(a.n),note:''}];
  P=migrate(p);resetHistory();VER++;UI.cls=null;UI.cond.sid=null;UI.grid.sel=null;UI.snapped=false;touch();toast('サンプルデータを読み込みました（フォームの回答が入力済みの想定）')
}

document.addEventListener('keydown',e=>{
  const typing=/^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement||{}).tagName);
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!typing){e.preventDefault();e.shiftKey?doRedo():doUndo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='y'&&!typing){e.preventDefault();doRedo();return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();fileHandle?writeFile().then(()=>toast('ファイルに保存しました')):pickSaveFile();return}
  if(e.key==='Escape'){if($('#picker')){closePicker();return}if(UI.menu){UI.menu=false;paintMenu();return}if(UI.grid.sel){UI.grid.sel=null;render()}return}

});
