<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>かこピタ｜家訪・懇談 日程づくり</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%231A8FD9'/%3E%3Cpath d='M11 17v-4a2 2 0 0 1 2-2h4M23 11h4a2 2 0 0 1 2 2v4M29 23v4a2 2 0 0 1-2 2h-4M17 29h-4a2 2 0 0 1-2-2v-4' fill='none' stroke='%23fff' stroke-width='2.7' stroke-linecap='round'/%3E%3Crect x='15.5' y='15.5' width='9' height='9' rx='2.4' fill='%23FFDF5E'/%3E%3C/svg%3E">
<style>:root{
  --bg:#F4F9FD; --paper:#FFFFFF; --ink:#1E3350; --ink2:#586D88; --ink3:#8DA0B6;
  --line:#D8E6F2; --line2:#E8F1F8; --brand:#1A8FD9; --brand2:#1278BD; --brand-t:#E3F3FD;
  --snap:#FFDF5E; --ok:#14A583; --ok-t:#D8F5EC; --ng:#EE5A68; --ng-t:#FFE5E8;
  --warn:#D68A00; --warn-t:#FFF2CC; --u-t:#ECEAF6; --u:#8582AC;
  --shadow:0 1px 2px rgba(30,70,110,.06),0 8px 24px rgba(30,100,160,.08);
  --rail:112px; --top:58px;
  --font:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(rgba(26,143,217,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(26,143,217,.055) 1px,transparent 1px),linear-gradient(180deg,#E6F4FD 0,rgba(244,249,253,0) 320px);background-size:28px 28px,28px 28px,100% 320px;background-repeat:repeat,repeat,no-repeat;background-attachment:fixed,fixed,fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.ic{flex:none;vertical-align:middle}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#top{position:fixed;inset:0 0 auto 0;height:var(--top);display:flex;align-items:center;gap:14px;padding:0 18px 0 14px;background:var(--paper);border-bottom:1px solid var(--line);z-index:30}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:.02em;text-decoration:none;color:var(--ink);background:none;border:0;padding:0}
.logo svg{display:block}
.logo b{background:linear-gradient(transparent 62%,var(--snap) 62%);padding:0 2px}
.ttl{flex:1;min-width:120px;max-width:420px}
.ttl input{width:100%;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 10px;font-weight:700;font-size:15px}
.ttl input:hover{border-color:var(--line)} .ttl input:focus{border-color:var(--brand);background:var(--paper);outline:none}
.ttl input::placeholder{color:var(--ink3);font-weight:500}
.sp{flex:1}
.tbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:6px 10px;color:var(--ink2);font-weight:600}
.tbtn:hover{border-color:var(--brand);color:var(--brand)} .tbtn[disabled]{opacity:.4;pointer-events:none}
.tbtn.icon{padding:7px}
.chip-save{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;font-size:12.5px;color:var(--ink2);font-weight:600}
.chip-save i{width:8px;height:8px;border-radius:50%;background:var(--ok);display:block}
.chip-save.warn i{background:var(--warn)} .chip-save.busy i{background:var(--brand);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}

#rail{position:fixed;top:var(--top);bottom:0;left:0;width:var(--rail);background:var(--paper);border-right:1px solid var(--line);z-index:20;display:flex;flex-direction:column;align-items:center;padding:12px 8px 20px;overflow:auto}
.rs{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;padding:5px 2px;border:0;background:none;color:var(--ink2);font-size:12.5px;font-weight:800;border-radius:14px}
.rs .nd{width:46px;height:46px;border-radius:16px;display:grid;place-items:center;background:var(--bg);border:1.5px solid var(--line);position:relative;transition:transform .15s,border-color .15s,background .15s}
.rs:hover .nd{border-color:var(--brand);transform:translateY(-1px)}
.rs .nb{position:absolute;top:-7px;left:-7px;min-width:21px;height:21px;border-radius:11px;background:var(--ink3);color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid var(--paper)}
.rs.done .nd{background:var(--ok-t);border-color:var(--ok);color:var(--ok)} .rs.done .nb{background:var(--ok)}
.rs.cur{color:var(--ink)} .rs.cur .nd{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-t)} .rs.cur .nb{background:var(--brand2)}
.rs.soon{color:var(--ink3)} .rs.soon .nd{border-style:dashed;background:transparent}
.rs .bd{position:absolute;bottom:-5px;right:-7px;min-width:19px;height:19px;border-radius:10px;background:var(--brand);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--paper)}
.rs .sn{font-size:10.5px;font-weight:700;color:var(--ink3);margin-top:-3px}
.rs .tag{font-size:10.5px;font-weight:800;color:#7A5600;background:var(--snap);border-radius:8px;padding:1px 7px;line-height:1.35;text-align:center}
.rarrow{color:var(--ink3);height:18px;display:grid;place-items:center;margin:-1px 0}
.rarrow.on{color:var(--brand)}
.rgroup{width:100%;font-size:10.5px;font-weight:800;color:var(--ink3);text-align:center;margin:8px 0 4px;letter-spacing:.03em;line-height:1.3}
.rbox{width:100%;background:linear-gradient(#FFF8D6,#FFFCEE);border:1.5px solid #FFE394;border-radius:20px;padding:6px 2px 10px;margin:2px 0 0}
.rbox .rgroup{color:#9A6B00;margin-top:4px}
.rail-gap{height:6px}
#main{position:absolute;top:var(--top);left:var(--rail);right:0;bottom:0;overflow:auto;padding:22px 26px 110px}
.page{max-width:1500px;margin:0 auto}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{font-size:24px;font-weight:800;letter-spacing:.01em}
.ph p{color:var(--ink2);margin-top:2px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:16px}
.panel h2{font-size:15.5px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h2 small{font-weight:500;color:var(--ink2);font-size:12.5px}
.muted{color:var(--ink2)} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.grow{flex:1}
.cols2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:1100px){.cols2{grid-template-columns:1fr}}

/* buttons / inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:8px 14px;font-weight:700;color:var(--ink);transition:transform .08s,border-color .12s,background .12s}
.btn:hover{border-color:var(--brand);color:var(--brand)} .btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff} .btn.pri:hover{background:var(--brand2);border-color:var(--brand2);color:#fff}
.btn.big{padding:12px 20px;font-size:15.5px;border-radius:13px}
.btn.sm{padding:5px 10px;font-size:12.5px;border-radius:9px}
.btn.danger:hover{border-color:var(--ng);color:var(--ng)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink2)} .btn.ghost:hover{background:var(--brand-t);color:var(--brand)}
.btn[disabled],.btn.off{opacity:.45;pointer-events:none}
.soon-tag{font-size:10.5px;font-weight:700;background:var(--warn-t);color:var(--warn);border-radius:6px;padding:1px 6px}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 10px;min-width:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-t)}
input[type=number]{width:84px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:12.5px;color:var(--ink2)}
label.f input,label.f select{font-weight:500;color:var(--ink)}
.seg{display:inline-flex;background:var(--bg);border:1.5px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{border:0;background:none;border-radius:8px;padding:5px 12px;font-weight:700;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.seg button.on{background:var(--paper);color:var(--brand);box-shadow:0 1px 3px rgba(20,32,54,.15)}
.tog{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink2);cursor:pointer;user-select:none}
.tog input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:7px;padding:1px 8px;font-size:12px;font-weight:700;background:var(--bg);color:var(--ink2)}
.badge.ok{background:var(--ok-t);color:var(--ok)} .badge.ng{background:var(--ng-t);color:var(--ng)} .badge.warn{background:var(--warn-t);color:var(--warn)} .badge.u{background:var(--u-t);color:var(--u)} .badge.brand{background:var(--brand-t);color:var(--brand)}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:26px;align-items:center;padding:26px 28px}
@media (max-width:1100px){.hero{grid-template-columns:1fr}}
.hero h1{font-size:30px;line-height:1.3;font-weight:800;letter-spacing:.01em}
.hero p{color:var(--ink2);margin:8px 0 18px;max-width:34em}
.journey{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.jt{position:relative;border:1.5px solid var(--line);border-radius:14px;padding:12px 8px 10px;text-align:center;background:var(--paper);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:13px;cursor:pointer;color:var(--ink)}
.jt:hover{border-color:var(--brand)}
.jt .ji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--bg);color:var(--ink2)}
.jt.done{border-color:var(--ok)} .jt.done .ji{background:var(--ok-t);color:var(--ok)}
.jt.cur{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-t)} .jt.cur .ji{background:var(--brand);color:#fff}
.jt.soon{border-style:dashed;color:var(--ink3)}
.jt small{font-weight:500;color:var(--ink2);font-size:11.5px;min-height:1.5em}
.jt.snap{animation:snapin .55s cubic-bezier(.2,1.4,.4,1) both}
@keyframes snapin{0%{transform:translateY(-14px) scale(1.08);opacity:0;background:var(--snap)}60%{opacity:1}100%{transform:none;background:var(--paper)}}
@media (max-width:760px){.journey{grid-template-columns:repeat(3,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:16px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.kpi .l{font-weight:700;color:var(--ink2);font-size:12.5px}
.kpi .v{font-size:28px;font-weight:800;line-height:1.2;margin:2px 0 6px}
.kpi .v small{font-size:14px;font-weight:600;color:var(--ink2);margin-left:3px}
.bar{height:7px;border-radius:5px;background:var(--bg);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--brand)} .bar i.ok{background:var(--ok)} .bar i.ng{background:var(--ng)}
.cboard{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:14px}
.ctile{position:relative;text-align:left;border:1px solid var(--line);border-radius:14px;background:var(--paper);padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .12s,box-shadow .12s}
.ctile:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.ctile .cb{height:8px}
.ctile .ci{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.ctile h3{font-size:18px;font-weight:800;display:flex;align-items:center;gap:8px}
.ctile .tn{color:var(--ink2);font-size:12.5px;min-height:1.4em}
.ctile .pl{display:grid;grid-template-columns:3.6em 1fr auto;align-items:center;gap:8px;font-size:12px;color:var(--ink2);font-weight:600}
.heat{border-collapse:separate;border-spacing:3px;font-size:12.5px}
.heat th{font-weight:700;color:var(--ink2);padding:2px 6px;white-space:nowrap}
.heat td{min-width:54px;height:30px;text-align:center;border-radius:7px;font-weight:700;font-variant-numeric:tabular-nums}
.heat td.z{background:var(--bg);color:var(--ink3);font-weight:500}
.heat th.rowh{text-align:left}
.empty{border:2px dashed var(--line);border-radius:16px;padding:34px;text-align:center;color:var(--ink2)}
.empty h3{font-size:17px;color:var(--ink);margin-bottom:6px}

/* next bar */
#next{position:fixed;left:calc(var(--rail) + 50%);bottom:18px;transform:translateX(-50%);z-index:25}
#next:empty{display:none}
.nx{display:flex;align-items:center;gap:14px;background:var(--brand);color:#fff;border-radius:999px;padding:8px 8px 8px 22px;box-shadow:0 10px 30px rgba(26,143,217,.38);font-weight:800}
.nx span{opacity:.78;font-weight:600;font-size:13px}
.nx button{border:0;background:var(--snap);color:#142036;border-radius:999px;padding:9px 18px;font-weight:800;display:inline-flex;gap:8px;align-items:center}
.nx button:hover{filter:brightness(.96)}


/* ---------- roster ---------- */
.drop{border:2px dashed var(--line);border-radius:16px;padding:26px;text-align:center;background:var(--bg);transition:border-color .12s,background .12s}
.drop.over{border-color:var(--brand);background:var(--brand-t)}
.drop h3{font-size:16px;margin-bottom:4px}
textarea.paste{width:100%;min-height:90px;font-family:ui-monospace,Consolas,monospace;font-size:12.5px;resize:vertical}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{position:sticky;top:0;background:var(--paper);text-align:left;padding:7px 8px;border-bottom:2px solid var(--line);font-size:12px;color:var(--ink2);z-index:1}
.tbl td{padding:3px 8px;border-bottom:1px solid var(--line2)}
.tbl input{width:100%;border-color:transparent;background:transparent;padding:4px 6px}
.tbl input:hover{border-color:var(--line)} .tbl input:focus{background:var(--paper)}
.tbl tr:hover td{background:rgba(59,91,255,.04)}
.scroll{max-height:440px;overflow:auto;border:1px solid var(--line);border-radius:12px}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.pv th,.pv td{white-space:nowrap}
.pv td.sk{opacity:.4}
.warnbox{background:var(--warn-t);color:#6B4A00;border-radius:12px;padding:10px 14px;font-size:13px}
.okbox{background:var(--ok-t);color:#0B6A52;border-radius:12px;padding:10px 14px;font-size:13px}
.ngbox{background:var(--ng-t);color:#8E1F27;border-radius:12px;padding:10px 14px;font-size:13px}


/* class bar */
.cbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cp{border:1.5px solid transparent;border-radius:10px;padding:5px 11px;font-weight:800;font-size:13px;background:var(--cbg,var(--bg));color:var(--cfg,var(--ink));display:inline-flex;align-items:center;gap:6px}
.cp:hover{border-color:var(--cfg,var(--brand))}
.cp.on{border-color:var(--cfg,var(--brand));box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--cfg,var(--brand))}
.cp small{font-weight:600;opacity:.75}

/* ---------- schedule ---------- */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rcards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:760px){.rcards{grid-template-columns:1fr}}
.rc{text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:13px;padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.rc b{font-size:14px} .rc span{font-size:12.5px;color:var(--ink2)}
.rc.on{border-color:var(--brand);background:var(--brand-t)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.dchip{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:4px 6px 4px 11px;font-weight:700;background:var(--paper)}
.dchip.sa{color:#2F67B5;background:#EAF3FF;border-color:#BBD6FA} .dchip.su{color:#C03A3A;background:#FFEDED;border-color:#F4BDBD}
.dchip button{border:0;background:none;color:inherit;opacity:.55;border-radius:6px;display:grid;place-items:center;padding:2px}
.dchip button:hover{opacity:1;background:rgba(0,0,0,.08)}
.pvgrid{display:grid;gap:3px;font-size:12px}
.pvgrid div{padding:3px 6px;border-radius:5px;background:var(--brand-t);color:var(--brand2);text-align:center;font-weight:700;white-space:nowrap}
.pvgrid .h{background:transparent;color:var(--ink2)} .pvgrid .t{background:transparent;color:var(--ink2);text-align:right}
.pvgrid .late{background:var(--warn-t);color:var(--warn)} .pvgrid .cut{background:transparent;border-top:2px dashed var(--warn);padding:0;height:0}

/* ---------- condition view ---------- */
.cv{display:grid;grid-template-columns:268px minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1380px){.cv{grid-template-columns:250px minmax(0,1fr)}.cv .cside{grid-column:2}}
@media (max-width:820px){.cv{grid-template-columns:1fr}.cv .cside{grid-column:1}}
.slist{display:flex;flex-direction:column;gap:3px;max-height:calc(100vh - 290px);overflow:auto;padding:2px}
.si{display:grid;grid-template-columns:2em 1fr auto;align-items:center;gap:8px;border:1.5px solid transparent;border-radius:10px;padding:6px 9px;background:none;text-align:left}
.si:hover{background:var(--bg)} .si.on{background:var(--brand-t);border-color:var(--brand)}
.si .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.si .no{color:var(--ink3);font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.th{display:block;width:46px;height:8px;border-radius:4px;background:var(--line2);overflow:hidden;position:relative}
.th i{position:absolute;top:0;bottom:0;left:0;display:block}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.o{background:var(--ok)} .dot.x{background:var(--brand)} .dot.free{background:var(--ok)} .dot.unans{background:var(--ng)} .dot.blank{background:var(--line)}
.brushes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bz{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--paper);border-radius:11px;padding:6px 12px 6px 7px;font-weight:700}
.bz .gl{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-weight:800;font-size:15px}
.bz kbd{font:inherit;font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.bz.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-t)}
.gl.x{background:var(--ng-t);color:var(--ng)} .gl.o{background:var(--ok-t);color:var(--ok)} .gl.u{background:var(--u-t);color:var(--u)} .gl.e{background:var(--bg);color:var(--ink3)}
.cm{border-collapse:separate;border-spacing:3px;user-select:none;touch-action:none}
.cm th{font-size:12.5px;font-weight:700;color:var(--ink2);padding:3px 4px;text-align:center;white-space:nowrap}
.cm th.hb{cursor:pointer;border-radius:8px} .cm th.hb:hover{background:var(--brand-t);color:var(--brand)}
.cm th.we{color:#C03A3A}
.cm td.cl{width:62px;height:36px;border-radius:8px;background:var(--bg);text-align:center;font-weight:800;font-size:16px;cursor:pointer;position:relative;color:var(--ink3);border:1px solid var(--line2)}
.cm td.cl:hover{border-color:var(--brand)}
.cm td.cl.x{background:var(--ng-t);color:var(--ng);border-color:transparent} .cm td.cl.o{background:var(--ok-t);color:var(--ok);border-color:transparent} .cm td.cl.u{background:var(--u-t);color:var(--u);font-size:13px;border-color:transparent}
.cm td.cl.si-i::after{content:"";position:absolute;top:0;right:0;border:5px solid transparent;border-top-color:var(--brand);border-right-color:var(--brand);border-radius:0 7px 0 0}
.cm tr.cutrow td,.cm tr.cutrow th{border-top:2px dashed var(--warn)}

/* popover / modal / toast */

@keyframes shk2{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}

@keyframes fsub{0%,50%{opacity:0;transform:translateY(8px)}70%,100%{opacity:1;transform:none}}

/* ---- class table / blocks ---- */
.dsheet{position:relative;background:#fff;color:#111;overflow:hidden;box-sizing:border-box;page-break-after:always;break-after:page;font-family:"BIZ UDPGothic","Hiragino Sans","Yu Gothic","Meiryo",sans-serif}
.dsheet.land{padding:8mm 10mm}
.dh1{font-size:17pt;line-height:1.2;border-bottom:2px solid #111;padding-bottom:2mm;margin-bottom:3mm;display:flex;align-items:baseline;gap:6mm}
.dh1 b{font-size:22pt}.dh2{font-size:11pt;color:#444;margin-left:auto}
.ttab{width:100%;border-collapse:collapse;table-layout:fixed}
.ttab th,.ttab td{border:1px solid #444;padding:.4mm 1.4mm;vertical-align:middle}
.ttab .ad{display:block;margin:0;max-width:none;white-space:normal;overflow:visible;text-overflow:clip}
.ttab thead th{background:#e9eef4;font-size:11pt;height:8mm;font-weight:800}
.ttab th.tm{width:15mm;background:#f2f4f7;font-size:10pt;text-align:right}
.ttab td.h{vertical-align:top}.ttab td.b{background:#ddd;text-align:center;color:#555;font-size:9pt}
.ttab .nm{font-weight:800;line-height:1.15;display:flex;gap:2mm;align-items:baseline}
.ttab .nm .no{font-size:.62em;font-weight:600;color:#555}
.ttab .ad,.ttab .sb{line-height:1.2;color:#333}
.dfoot{position:absolute;left:10mm;right:10mm;bottom:6mm;font-size:8.5pt;color:#444}
.dsheet.blk{padding:6mm}
.bh{height:9mm;display:flex;align-items:baseline;gap:4mm;font-size:9pt;color:#444}.bh b{font-size:14pt;color:#111}.bpg{margin-left:auto}
.bgrid{display:grid;gap:0}
.cb{border:1px solid #666;padding:.8mm 1mm;display:flex;flex-direction:column;overflow:hidden;min-width:0}
.cbh{display:flex;align-items:baseline;gap:1.5mm;white-space:nowrap;overflow:hidden}
.cbh .no{font-weight:600;color:#555;margin-right:.5mm}.cbs{font-size:6pt;border:1px solid #333;border-radius:2px;padding:0 1mm}.cbs.u{background:#555;color:#fff}
.cba{color:#444;margin-left:auto;overflow:hidden;text-overflow:ellipsis}
.cbt{width:100%;border-collapse:collapse;table-layout:fixed;flex:1}
.cbt th{font-weight:600;color:#444;padding:0;text-align:center;border:0}
.cbt th:first-child{width:6.5mm;text-align:right;padding-right:.8mm}
.cbt td{border:.4pt solid #999;text-align:center;padding:0;line-height:1;font-weight:800}
.cbt td.x{background:#f6c9cd;color:#b3202c}.cbt td.o{background:#c6ecdc;color:#0b6a52}.cbt td.u{background:#d9d7e8;color:#4a4670}
.cbf{display:flex;flex-direction:column;color:#333;line-height:1.15;overflow:hidden;min-height:7mm}
.cbf span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slip .s-addr{text-align:center;font-size:11pt;color:#333;margin:-2mm 0 3mm}

.uc>span:nth-child(2){min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:0 1 auto}
.uc .ad{flex:0 0 auto;max-width:48%}
.uc .badge{flex:none}

/* ---- v0.48 : 処理中の表示 ---- */
@keyframes spin{to{transform:rotate(360deg)}}
#busy{position:fixed;top:calc(var(--top) + 12px);left:calc(var(--rail) + (100vw - var(--rail)) / 2);transform:translateX(-50%);z-index:130;background:#fff;color:#1E3350;border:2px solid var(--brand);border-radius:999px;padding:9px 20px;font-weight:800;display:flex;gap:10px;align-items:center;box-shadow:0 10px 28px rgba(30,100,160,.28);white-space:nowrap}
#busy .bsp{width:15px;height:15px;border:3px solid var(--brand-t);border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
#busy .bdt{display:inline-block;width:1.7em;text-align:left;letter-spacing:.08em}
#busy .bsec{font-weight:600;color:var(--ink2);font-size:12px}
body.busy #toasts{top:calc(var(--top) + 70px)}
/* ---- v0.43 : 学級の一覧表（白黒印刷向き） ---- */
.ttab td.h{background:#fff}.ttab .nm{white-space:nowrap}.ttab .nm .t{white-space:nowrap}
.ttab td.sbc{border-left:1.3mm solid #C00000}
.sbr{color:#C00000;font-weight:800}.ttab .star{color:#C00000;font-weight:900;margin-left:.6mm}
.sbl{margin-top:1.8mm;column-count:2;column-gap:6mm;line-height:1.3;color:#222}
.sbl .sh{font-weight:800;color:#C00000;column-span:all;margin-bottom:.6mm}.sbl .sl1{break-inside:avoid}.sbl b{color:#C00000}
.dcr{font-size:7.5pt;color:#555;text-align:right;margin-bottom:.8mm}
/* ---- v0.42 ---- */
.logo .lgt{display:block}
.rs .rsub{display:block;font-size:11px;font-weight:800;margin-top:-2px}
.clsbadge{background:var(--brand-t);color:var(--brand2);font-weight:800;border-radius:10px;padding:4px 12px;white-space:nowrap}
body.cm .dlg [data-set],body.cm .aosel,body.cm .dlg [data-ao="all"],body.cm .dlg [data-ao="sel"]{display:none!important}
.sheet.sl{display:flex}
.sheet .half{box-sizing:border-box;overflow:hidden;position:relative;flex:none}
.sheet .hin{width:210mm;height:148.5mm;padding:15mm 20mm 10mm;box-sizing:border-box;transform-origin:0 0}
.sheet .cutline.h{position:absolute;left:0;right:0;top:50%;border-top:1px dashed #9aa;height:0}
.sheet .cutline.v{position:absolute;top:0;bottom:0;left:50%;border-left:1px dashed #9aa;width:0}
.sheet .cutline.v span{left:-10px;top:4mm;writing-mode:vertical-rl;padding:4px 0}
body.cm [data-act="g-lockall"]{display:none!important}
.logo .lt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.logo .lt .nm0{font-size:19px;font-weight:800;color:var(--brand2);letter-spacing:.03em}
.logo .lt small{font-size:10.5px;font-weight:700;color:var(--ink2);opacity:.75;letter-spacing:.02em;white-space:nowrap}
@media(max-width:1100px){.logo .lt small{display:none}}
</style>
</head>

const RELAY_PS="# kakopita-server.ps1 : Kakopita relay (localhost only). Run via the .bat file.\r\n$ErrorActionPreference = 'Stop'\r\n$root = $PSScriptRoot\r\nif ([string]::IsNullOrEmpty($root)) { $root = Split-Path -Parent $MyInvocation.MyCommand.Path }\r\n\r\n$html = Get-ChildItem -LiteralPath $root -Filter '*.html' |\r\n  Where-Object { $_.Name -like 'かこピタ*' -or $_.Name -like 'kakopita*' } |\r\n  Sort-Object LastWriteTime -Descending | Select-Object -First 1\r\nif (-not $html) {\r\n  Write-Host 'The Kakopita HTML file was not found in this folder.' -ForegroundColor Red\r\n  Read-Host 'Press Enter to close'\r\n  exit 1\r\n}\r\n\r\n$token = [guid]::NewGuid().ToString('N')\r\n$listener = $null\r\n$port = 0\r\nforeach ($p in 8765..8785) {\r\n  $l = New-Object System.Net.HttpListener\r\n  $l.Prefixes.Add(\"http://localhost:$p/\")\r\n  $l.Prefixes.Add(\"http://127.0.0.1:$p/\")\r\n  try { $l.Start(); $listener = $l; $port = $p; break } catch { $l.Close() }\r\n}\r\nif (-not $listener) {\r\n  Write-Host 'No free port (8765-8785) was found.' -ForegroundColor Red\r\n  Read-Host 'Press Enter to close'\r\n  exit 1\r\n}\r\n\r\n$blocked = @('.bat', '.cmd', '.ps1', '.exe', '.vbs', '.js', '.lnk', '.dll', '.msi', '.com', '.scr', '.wsf', '.hta', '.reg')\r\n\r\nfunction Resolve-KP([string]$rel) {\r\n  if ([string]::IsNullOrEmpty($rel)) { return $root }\r\n  $rel = $rel.Replace('/', '\\')\r\n  if ($rel -match '(^|\\\\)\\.\\.(\\\\|$)' -or $rel.StartsWith('\\') -or $rel.Contains(':')) { return $null }\r\n  $full = [System.IO.Path]::GetFullPath((Join-Path $root $rel))\r\n  $rootFull = [System.IO.Path]::GetFullPath($root).TrimEnd('\\') + '\\'\r\n  if (-not (($full + '\\').StartsWith($rootFull, [System.StringComparison]::OrdinalIgnoreCase))) { return $null }\r\n  return $full\r\n}\r\nfunction Send-KP($res, [int]$code, [byte[]]$bytes, [string]$type) {\r\n  $res.StatusCode = $code\r\n  $res.ContentType = $type\r\n  $res.Headers.Add('Cache-Control', 'no-store')\r\n  # The page is opened from a local file (file://), so allow it to call this relay (the token is still required).\r\n  $res.Headers.Add('Access-Control-Allow-Origin', '*')\r\n  $res.Headers.Add('Access-Control-Allow-Headers', 'X-KP-Token, Content-Type')\r\n  $res.Headers.Add('Access-Control-Allow-Methods', 'GET, POST, OPTIONS')\r\n  $res.Headers.Add('Access-Control-Allow-Private-Network', 'true')\r\n  $res.Headers.Add('Access-Control-Expose-Headers', 'X-Mtime')\r\n  if ($bytes -ne $null) {\r\n    $res.ContentLength64 = $bytes.Length\r\n    $res.OutputStream.Write($bytes, 0, $bytes.Length)\r\n  }\r\n}\r\nfunction Text-KP($res, [int]$code, [string]$text, [string]$type) {\r\n  Send-KP $res $code ([System.Text.Encoding]::UTF8.GetBytes($text)) $type\r\n}\r\nfunction Mtime-KP($path) {\r\n  $d = (Get-Item -LiteralPath $path).LastWriteTimeUtc\r\n  return [long](($d - [datetime]'1970-01-01').TotalMilliseconds)\r\n}\r\n\r\n# Copy the page to a local temp folder and open it as a local file. No http/https address is opened,\r\n# so tools that redirect web addresses to an isolated browser are not involved.\r\n$tmpDir = Join-Path $env:TEMP 'kakopita'\r\n[void][System.IO.Directory]::CreateDirectory($tmpDir)\r\n$localHtml = Join-Path $tmpDir 'kakopita.html'\r\nCopy-Item -LiteralPath $html.FullName -Destination $localHtml -Force\r\n$fileUrl = ([System.Uri]$localHtml).AbsoluteUri + \"?kpport=$port&t=$token\"\r\n\r\nfunction Open-KP([string]$url) {\r\n  # Start Edge or Chrome directly (instead of the default URL handler), because some\r\n  # workplace tools redirect every http/https address to a remote/isolated browser.\r\n  $keys = @(\r\n    'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\msedge.exe',\r\n    'HKLM:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\chrome.exe',\r\n    'HKCU:\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\App Paths\\chrome.exe'\r\n  )\r\n  foreach ($k in $keys) {\r\n    try {\r\n      $exe = (Get-ItemProperty -LiteralPath $k -ErrorAction Stop).'(default)'\r\n      if ($exe -and (Test-Path -LiteralPath $exe)) {\r\n        Start-Process -FilePath $exe -ArgumentList @('--new-window', $url)\r\n        return $true\r\n      }\r\n    } catch { }\r\n  }\r\n  return $false\r\n}\r\n\r\n$url = \"http://localhost:$port/?t=$token\"\r\nWrite-Host ''\r\nWrite-Host '=== Kakopita relay is running ===' -ForegroundColor Green\r\nWrite-Host (\"Folder : \" + $root)\r\nWrite-Host 'Keep this window open while you work. Close it to stop.'\r\nWrite-Host ''\r\nWrite-Host 'Opening Kakopita in the local Edge/Chrome as a local file...'\r\nWrite-Host 'If it does not open, copy this address into Edge or Chrome on THIS computer:'\r\nWrite-Host $fileUrl -ForegroundColor Cyan\r\nWrite-Host ''\r\nWrite-Host '(Fallback, normal web address - may be redirected by your workplace tools:)'\r\nWrite-Host $url\r\nWrite-Host ''\r\nif (-not $env:KP_NOOPEN) {\r\n  if (-not (Open-KP $fileUrl)) { Start-Process $fileUrl }\r\n}\r\n\r\nwhile ($listener.IsListening) {\r\n  $ctx = $listener.GetContext()\r\n  $req = $ctx.Request\r\n  $res = $ctx.Response\r\n  try {\r\n    $path = $req.Url.AbsolutePath\r\n    $hn = $req.Url.Host\r\n    if ($hn -ne 'localhost' -and $hn -ne '127.0.0.1') {\r\n      Text-KP $res 403 'forbidden' 'text/plain'\r\n    }\r\n    elseif ($req.HttpMethod -eq 'OPTIONS') {\r\n      Send-KP $res 204 $null 'text/plain'\r\n    }\r\n    elseif ($path -eq '/' -or $path -eq '/index.html') {\r\n      Send-KP $res 200 ([System.IO.File]::ReadAllBytes($html.FullName)) 'text/html; charset=utf-8'\r\n    }\r\n    elseif ($path.StartsWith('/api/')) {\r\n      if ($req.Headers['X-KP-Token'] -ne $token) {\r\n        Text-KP $res 403 'forbidden' 'text/plain'\r\n      }\r\n      else {\r\n        $rel = ''\r\n        if ($req.Url.Query -match '[?&]p=([^&]*)') { $rel = [System.Uri]::UnescapeDataString($Matches[1]) }\r\n        $op = $path.Substring(5)\r\n        $full = Resolve-KP $rel\r\n        if ($op -eq 'ping') {\r\n          $nm = ConvertTo-Json -InputObject (Split-Path -Leaf $root) -Compress\r\n          Text-KP $res 200 ('{\"app\":\"kakopita\",\"name\":' + $nm + '}') 'application/json; charset=utf-8'\r\n        }\r\n        elseif ($null -eq $full) {\r\n          Text-KP $res 400 'bad path' 'text/plain'\r\n        }\r\n        elseif ($op -eq 'stat') {\r\n          if (Test-Path -LiteralPath $full -PathType Leaf) { Text-KP $res 200 ('{\"kind\":\"file\",\"mtime\":' + (Mtime-KP $full) + '}') 'application/json' }\r\n          elseif (Test-Path -LiteralPath $full -PathType Container) { Text-KP $res 200 '{\"kind\":\"dir\"}' 'application/json' }\r\n          else { Text-KP $res 404 'not found' 'text/plain' }\r\n        }\r\n        elseif ($op -eq 'list') {\r\n          if (Test-Path -LiteralPath $full -PathType Container) {\r\n            $parts = @()\r\n            foreach ($it in Get-ChildItem -LiteralPath $full) {\r\n              $nm = ConvertTo-Json -InputObject $it.Name -Compress\r\n              $isd = 'false'\r\n              if ($it.PSIsContainer) { $isd = 'true' }\r\n              $parts += ('{\"name\":' + $nm + ',\"dir\":' + $isd + '}')\r\n            }\r\n            Text-KP $res 200 ('[' + ($parts -join ',') + ']') 'application/json; charset=utf-8'\r\n          }\r\n          else { Text-KP $res 404 'not found' 'text/plain' }\r\n        }\r\n        elseif ($op -eq 'read') {\r\n          if (Test-Path -LiteralPath $full -PathType Leaf) {\r\n            $res.Headers.Add('X-Mtime', [string](Mtime-KP $full))\r\n            Send-KP $res 200 ([System.IO.File]::ReadAllBytes($full)) 'text/plain; charset=utf-8'\r\n          }\r\n          else { Text-KP $res 404 'not found' 'text/plain' }\r\n        }\r\n        elseif ($op -eq 'write') {\r\n          $ext = [System.IO.Path]::GetExtension($full).ToLower()\r\n          if ($blocked -contains $ext -or $full -eq $root) { Text-KP $res 403 'blocked file type' 'text/plain' }\r\n          elseif ($req.ContentLength64 -gt 52428800) { Text-KP $res 413 'too large' 'text/plain' }\r\n          else {\r\n            $ms = New-Object System.IO.MemoryStream\r\n            $req.InputStream.CopyTo($ms)\r\n            [void][System.IO.Directory]::CreateDirectory((Split-Path -Parent $full))\r\n            $tmp = $full + '.kptmp'\r\n            [System.IO.File]::WriteAllBytes($tmp, $ms.ToArray())\r\n            Move-Item -LiteralPath $tmp -Destination $full -Force\r\n            Text-KP $res 200 '{\"ok\":true}' 'application/json'\r\n          }\r\n        }\r\n        elseif ($op -eq 'mkdir') {\r\n          [void][System.IO.Directory]::CreateDirectory($full)\r\n          Text-KP $res 200 '{\"ok\":true}' 'application/json'\r\n        }\r\n        elseif ($op -eq 'delete') {\r\n          $ext = [System.IO.Path]::GetExtension($full).ToLower()\r\n          if ($blocked -contains $ext) { Text-KP $res 403 'blocked file type' 'text/plain' }\r\n          elseif (Test-Path -LiteralPath $full -PathType Leaf) {\r\n            Remove-Item -LiteralPath $full -Force\r\n            Text-KP $res 200 '{\"ok\":true}' 'application/json'\r\n          }\r\n          else { Text-KP $res 404 'not found' 'text/plain' }\r\n        }\r\n        else { Text-KP $res 404 'unknown' 'text/plain' }\r\n      }\r\n    }\r\n    else { Text-KP $res 404 'not found' 'text/plain' }\r\n  }\r\n  catch {\r\n    $msg = $_.Exception.Message\r\n    # The browser closed the connection (e.g. it was redirected elsewhere): not a real error, ignore quietly.\r\n    if ($msg -notmatch 'ネットワーク名|network name|I/O operation|既に|forcibly|aborted') {\r\n      Write-Host ('Error: ' + $msg) -ForegroundColor Yellow\r\n    }\r\n    try { Text-KP $res 500 'server error' 'text/plain' } catch { }\r\n  }\r\n  finally {\r\n    try { $res.Close() } catch { }\r\n  }\r\n}\r\n";

let SRV=null;   // 中継プログラム（バッチで起動したPowerShell）経由のとき

function makeSrvDir(){   // File System Access のフォルダと同じ形で使える「身代わり」
  const NF=()=>new DOMException('not found','NotFoundError');
  const call=(op,p,body)=>fetch(`${SRV.base||''}/api/${op}?p=${encodeURIComponent(p||'')}`,{method:body===undefined?'GET':'POST',headers:{'X-KP-Token':SRV.token},body,cache:'no-store'});
  const join=(a,b)=>a?a+'/'+b:b;
  const mkFile=(p,n)=>({kind:'file',name:n,
    async getFile(){const r=await call('read',p);if(!r.ok)throw NF();const txt=await r.text();return{text:async()=>txt,lastModified:+r.headers.get('X-Mtime')||Date.now()}},
    async createWritable(){let buf='';return{async write(d){buf+=(typeof d==='string'?d:String(d))},async close(){const r=await call('write',p,buf);if(!r.ok)throw new Error('書き込みに失敗しました（'+r.status+'）')}}}});
  const mkDir=(path,name)=>({kind:'directory',name,
    async getFileHandle(n,o={}){const p=join(path,n);if(!o.create){const r=await call('stat',p);if(!r.ok)throw NF();const j=await r.json();if(j.kind!=='file')throw NF()}return mkFile(p,n)},
    async getDirectoryHandle(n,o={}){const p=join(path,n);if(o.create){const r=await call('mkdir',p,'');if(!r.ok)throw NF()}else{const r=await call('stat',p);if(!r.ok)throw NF();const j=await r.json();if(j.kind!=='dir')throw NF()}return mkDir(p,n)},
    async removeEntry(n){const r=await call('delete',join(path,n),'');if(!r.ok)throw NF()},
    async *entries(){const r=await call('list',path);if(!r.ok)return;for(const e of await r.json())yield [e.name,e.dir?mkDir(join(path,e.name),e.name):mkFile(join(path,e.name),e.name)]},
    async queryPermission(){return 'granted'},async requestPermission(){return 'granted'}});
  return mkDir('',SRV.name);
}
const BUSY={labels:[],timer:null,t0:0};
function busyPaint(){
  let e=document.getElementById('busy');if(!e){e=document.createElement('div');e.id='busy';e.setAttribute('role','status');e.setAttribute('aria-live','polite');document.body.appendChild(e)}
  const ms=Date.now()-BUSY.t0,k=Math.floor(ms/400)%3+1,sec=Math.floor(ms/1000),l=BUSY.labels[BUSY.labels.length-1][1];
  e.innerHTML=`<span class="bsp"></span><span>${String(l).replace(/[<>&]/g,'')}</span><span class="bdt">${'.'.repeat(k)}</span>${sec>=3?`<span class="bsec">${sec}秒</span>`:''}`;
  document.body.classList.add('busy');
}
function busyStart(label){   // 押してから終わるまで「…」を動かして、受け付けたことを見せる
  const id={};BUSY.labels.push([id,label]);if(!BUSY.t0)BUSY.t0=Date.now();busyPaint();
  if(!BUSY.timer)BUSY.timer=setInterval(busyPaint,200);
  return()=>{BUSY.labels=BUSY.labels.filter(x=>x[0]!==id);
    if(BUSY.labels.length)busyPaint();else{clearInterval(BUSY.timer);BUSY.timer=null;BUSY.t0=0;const e=document.getElementById('busy');if(e)e.remove();document.body.classList.remove('busy')}};
}
function busyWrap(fn,label){return async function(...a){const done=busyStart(label);try{return await fn.apply(this,a)}finally{done()}}}

 sched:{dates:[],start:'14:00',slotMin:20,slotCount:20,cutMode:'effort',cutTime:'17:00'},

  const d=newProject();

  if(o&&o.opt&&!(parseFloat(o.kpv)>=0.42)){if(p.opt.areaAuto===true)p.opt.areaAuto=null;if(p.opt.showAddr===true)p.opt.showAddr=null}   // v0.42: 既定を「家庭訪問のときだけ」に変更

/* ---------- history ---------- */
let tx=null,undoS=[],redoS=[],VER=1;
function begin(){if(tx)return false;tx={ops:[]};return true}
function commit(){if(!tx)return;const t=tx;tx=null;if(t.ops.length){undoS.push(t);if(undoS.length>150)undoS.shift();redoS=[];touch()}}
function act(fn){const own=begin();try{return fn()}finally{if(own)commit()}}
function rec(u,r){if(tx)tx.ops.push({undo:u,redo:r});else touch()}
function setProp(o,k,v){const had=Object.prototype.hasOwnProperty.call(o,k),old=o[k];if(had&&old===v)return;o[k]=v;VER++;rec(()=>{had?o[k]=old:delete o[k]},()=>{o[k]=v})}
function delProp(o,k){if(!(k in o))return;const old=o[k];delete o[k];VER++;rec(()=>{o[k]=old},()=>{delete o[k]})}
function touch(){VER++;P.updatedAt=Date.now();scheduleSave();render()}
function doUndo(){if(tx)commit();const t=undoS.pop();if(!t){toast('取り消せる操作はありません');return}for(let i=t.ops.length-1;i>=0;i--)t.ops[i].undo();redoS.push(t);touch()}
function doRedo(){if(tx)commit();const t=redoS.pop();if(!t){toast('やり直せる操作はありません');return}for(const o of t.ops)o.redo();undoS.push(t);touch()}
function resetHistory(){undoS=[];redoS=[];tx=null}

/* ---------- derived ---------- */
let SC={k:'',slots:[],V:new Set()};
function getSlots(){
  const s=P.sched,k=[s.dates.join(','),s.start,s.slotMin,s.slotCount,s.cutMode,s.cutTime].join('/');
  if(SC.k!==k){
    const st=parseT(s.start);const base=st==null?840:st;let list=[];
    for(let i=0;i<clamp(+s.slotCount||0,0,300);i++){const t=base+i*(+s.slotMin||20);list.push({i,t,key:keyT(t),label:fmtT(t),end:fmtT(t+(+s.slotMin||20))})}
    if(s.cutMode==='strict'){const c=cutT();list=list.filter(x=>x.t<c)}
    const V=new Set();for(const d of s.dates)for(const x of list)V.add(d+'|'+x.key);
    SC={k,slots:list,V};
  }
  return SC.slots;
}
const validSet=()=>(getSlots(),SC.V);
const cutT=()=>{const c=parseT(P.sched.cutTime);return c==null?1020:c};
const isLate=sl=>P.sched.cutMode!=='none'&&sl.t>=cutT();
const dk=(d,key)=>d+'|'+key;
let BC={ver:0,map:new Map(),byId:new Map()};
function idx(){
  if(BC.ver!==VER){BC.map=new Map();BC.byId=new Map();
    for(const st of P.students){const k=st.g+'|'+st.c;if(!BC.map.has(k))BC.map.set(k,[]);BC.map.get(k).push(st);BC.byId.set(st.id,st)}
    for(const a of BC.map.values())a.sort((x,y)=>x.n-y.n);BC.ver=VER}
  return BC;
}
const members=k=>idx().map.get(k)||[];
const stById=id=>idx().byId.get(id);
function classList(){
  const out=[];for(const [k,arr] of idx().map){const c=P.classes[k]||{g:arr[0].g,c:arr[0].c,teacher:''};out.push({key:k,g:+c.g,c:c.c,teacher:c.teacher||'',obj:c,n:arr.length})}
  return out.sort((a,b)=>a.g-b.g||natCmp(a.c,b.c));
}
function ensureClass(g,c){const k=g+'|'+c;if(!P.classes[k])setProp(P.classes,k,{g,c,teacher:'',locked:false,grid:{},slots:1});return P.classes[k]}
function info(st){
  if(st._ci&&st._ci.ver===VER)return st._ci;
  const V=validSet();let nx=0,no=0,nu=0;
  for(const k in st.cond){if(!V.has(k))continue;const v=st.cond[k].v;if(v==='x')nx++;else if(v==='o')no++;else if(v==='u')nu++}
  return st._ci={ver:VER,nx,no,nu,total:V.size};
}
function slotOK(st,k){
  const c=st.cond[k];if(c&&(c.v==='x'||c.v==='u'))return false;
  if(info(st).no>0)return !!(c&&c.v==='o');
  return true;
}
function stStatus(st){const I=info(st);if(I.total&&I.nu===I.total)return 'unans';if(I.no>0)return I.no===I.total?'free':'o';if(I.nx>0||I.nu>0)return 'x';if(st.ok)return 'free';return 'blank'}
const entered=st=>['o','x','free'].includes(stStatus(st));
const STL={unans:'未回答',o:'○希望のみ',x:'×あり',free:'条件なし',blank:'未入力'};
/* placement */
function headKey(cls,sid){for(const k in cls.grid){const c=cls.grid[k];if(c.sid===sid&&c.head)return k}return null}
function spanKeys(k,n){
  const [d,t]=k.split('|');const sl=getSlots();const i=sl.findIndex(x=>x.key===t);if(i<0||i+n>sl.length)return null;
  const out=[];for(let j=0;j<n;j++)out.push(d+'|'+sl[i+j].key);return out;
}
function cellFree(cls,k,ign){const c=cls.grid[k];return !c||(c.sid&&ign.has(c.sid))}
function isNG(st,keys){return keys.some(k=>!slotOK(st,k))}
function placedKeys(cls,sid){const h=headKey(cls,sid);return h?spanKeys(h,cls.grid[h].n):[]}
function clearPlace(cls,sid){for(const k of Object.keys(cls.grid)){const c=cls.grid[k];if(c.sid===sid)delProp(cls.grid,k)}}
function putPlace(cls,st,k,exc){
  const n=Math.max(1,+st.slots||1);const keys=spanKeys(k,n);keys.forEach((kk,i)=>setProp(cls.grid,kk,i===0?{sid:st.id,head:1,n,...(exc?{exc:1}:{})}:{sid:st.id,cont:1}));
}
function cellNG(cls,k){ // head cell ng status
  const c=cls.grid[k];if(!c||!c.head||c.exc)return false;const st=stById(c.sid);if(!st)return false;return isNG(st,spanKeys(k,c.n)||[k]);
}
function sibFind(sb){
  const arr=P.students;
  if(sb.g&&sb.c&&sb.n){const m=arr.find(s=>s.g==sb.g&&String(s.c)==String(sb.c)&&s.n==sb.n);if(m)return m}
  if(sb.name){const nn=norm(sb.name);const m=arr.filter(s=>norm(s.name)===nn&&(!sb.g||s.g==sb.g)&&(!sb.c||String(s.c)==String(sb.c)));if(m.length===1)return m[0]}
  if(sb.kana){const kk=norm(sb.kana);if(kk){let m=arr.filter(s=>s.kana&&norm(s.kana)===kk&&(!sb.g||s.g==sb.g));if(m.length!==1)m=arr.filter(s=>s.kana&&norm(s.kana)===kk);if(m.length===1)return m[0]}}   // 学年・組・番号を間違えても、ふりがなで見つける
  return null;
}
const areaKey=(s,n)=>String(s.addr||'').normalize('NFKC').replace(/[\s\u3000]/g,'').slice(0,Math.max(1,+n||5));
function norm(s){
  s=String(s??'');
  for(const v of P.vari){if(v&&v[0])s=s.split(v[0]).join(v[1]||'')}
  s=s.normalize('NFKC').replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+0x60)).toLowerCase();
  s=s.replace(/[\s\u3000・.．,，?？!！()（）「」『』、。]/g,'').replace(/[-－―‐ｰ−ー]/g,'ー');
  return s.trim();
}
function progress(key){
  const mem=members(key),cls=P.classes[key];let ent=0,una=0,placed=0,ng=0;
  for(const s of mem){const t=stStatus(s);if(entered(s))ent++;if(t==='unans')una++;if(cls&&headKey(cls,s.id)){placed++}}
  if(cls)for(const k in cls.grid)if(cls.grid[k].head&&cellNG(cls,k))ng++;
  return{n:mem.length,ent,una,placed,ng};
}
function capacity(){const sl=getSlots().length;return sl*P.sched.dates.length}
function needSlots(key){return members(key).reduce((a,s)=>a+Math.max(1,+s.slots||1),0)}
function nextStep(){
  const n=P.students.length,dts=P.sched.dates.length;
  if(!n)return{view:'roster',title:'名簿を読み込みましょう',desc:'学年・組・番・名前の表を貼り付けるか、ファイルを選ぶだけで取り込めます。',cta:'名簿を読み込む',short:'名簿を読み込む'};
  if(!dts)return{view:'schedule',title:'日程を決めましょう',desc:'実施する日と、1日の時間割（開始時刻・1枠の長さ・枠数）を設定します。',cta:'日程を決める',short:'日程を決める'};
  let ent=0;for(const s of P.students)if(entered(s)||stStatus(s)==='unans')ent++;
  const cl=classList(),placedAny=cl.some(c=>progress(c.key).placed>0);
  if(ent<n&&!placedAny)return{view:'cond',title:'都合の悪い日時を入力しましょう',desc:'児童生徒ごとの「×（不可）」「○（この時間のみ可）」を入力します。フォームの回答は「3. フォーム」で取り込めます。',cta:'条件を入力する',short:'条件を入力する'};
  if(cl.every(c=>{const p=progress(c.key);return p.placed>=p.n-p.una&&p.ng===0}))return{view:'print',title:'配置がそろいました。お知らせを印刷しましょう',desc:'日程のお知らせを、A4に上下2段で印刷します。未回答の方への催促状も作れます。',cta:'お知らせを印刷する',short:'お知らせを印刷する'};
  return{view:'grid',title:'配置を進めましょう',desc:'未配置の児童生徒をマスにはめていきます。不可の時間帯は灰色で示されます。',cta:'かこピタ(配置)を開く',short:'配置を進める'};
}

/* ---------- persistence ---------- */
const SAVE={at:0,state:'idle',file:null,fileAt:0,lastBk:0,dirtyBk:false,err:''};
let dbp=null,saveT=0,fileT=0,fileHandle=null;
function dbOpen(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('kakopita',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function dbGet(k){const db=await dbOpen();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
async function dbSet(k,v){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbDel(k){const db=await dbOpen();return new Promise((res,rej)=>{const t=db.transaction('kv','readwrite');t.objectStore('kv').delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error)})}
async function dbKeys(){const db=await dbOpen();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})}
function scheduleSave(){
  SAVE.state='busy';SAVE.dirtyBk=true;paintSave();if(typeof shSchedule==='function')shSchedule();
  clearTimeout(saveT);saveT=setTimeout(saveNow,450);
  if(fileHandle){clearTimeout(fileT);fileT=setTimeout(writeFile,1500)}
}
async function saveNow(){
  try{await dbSet(KEY_P,serialize());SAVE.at=Date.now();SAVE.state='ok';SAVE.err='';
    if(SAVE.dirtyBk&&Date.now()-SAVE.lastBk>10*60*1000&&P.students.length)await makeBackup('自動');
  }catch(e){SAVE.state='err';SAVE.err=String(e&&e.message||e)}
  paintSave();
}
async function makeBackup(label){
  try{const at=Date.now();await dbSet('bk:'+at,{at,label,n:P.students.length,title:P.title,json:serialize()});SAVE.lastBk=at;SAVE.dirtyBk=false;
    const ks=(await dbKeys()).filter(k=>String(k).startsWith('bk:')).sort();while(ks.length>12)await dbDel(ks.shift());}catch(e){}
}
async function listBackups(){const ks=(await dbKeys()).filter(k=>String(k).startsWith('bk:')).sort().reverse();const out=[];for(const k of ks){const v=await dbGet(k);if(v)out.push({k,...v})}return out}
async function writeFile(){
  if(!fileHandle)return;
  try{const p=await fileHandle.queryPermission({mode:'readwrite'});if(p!=='granted'){SAVE.file={name:fileHandle.name,ok:false};paintSave();return}
    const w=await fileHandle.createWritable();await w.write(serialize());await w.close();SAVE.file={name:fileHandle.name,ok:true};SAVE.fileAt=Date.now();
  }catch(e){SAVE.file={name:fileHandle.name,ok:false,err:String(e.message||e)}}
  paintSave();
}
async function pickSaveFile(){

    try{const h=await showSaveFilePicker({suggestedName:`かこピタ_${(P.title||'日程').replace(/[\\/:*?"<>|]/g,'')}.json`,types:[{description:'かこピタ プロジェクト',accept:{'application/json':['.json']}}]});

/* ---- problem ---- */
function buildProblem(clsKey,o,limit17,exclude){
  const cls=P.classes[clsKey],dates=P.sched.dates,SL=getSlots(),L=SL.length,D=dates.length;

    for(const s2 of P.students)for(const b of s2.sib||[]){const m=sibFind(b);if(m&&m!==s2){add(s2,m);add(m,s2)}}
    list.forEach((st,s)=>{const r=rel.get(st.id);if(!r)return;
      for(const m of r.values()){
        if(idxOf.has(m.id)){links[s].peers.add(idxOf.get(m.id));continue}
        const c2=P.classes[m.g+'|'+m.c],hk=c2&&headKey(c2,m.id);if(!hk)continue;
        if(m.g+'|'+m.c===clsKey&&!o.keep)continue;
        const [d,t]=hk.split('|'),di=diOf.get(d),si=siOf.get(t);if(di==null||si==null)continue;
        links[s].anchors.push({di,si,n:c2.grid[hk].n})}});
  }
  const areaGroups=[],areaOf=new Int32Array(list.length).fill(-1);
  if(areaOn()){const m=new Map();list.forEach((st,s)=>{const k=areaKey(st,P.opt.areaN);if(!k)return;if(!m.has(k))m.set(k,[]);m.get(k).push(s)});for(const a of m.values())if(a.length>1)areaGroups.push(a);areaGroups.forEach((g,i)=>g.forEach(s=>areaOf[s]=i))}
  const areaId=new Int32Array(list.length);
  if(areaOn()&&P.opt.areaGap){const ids=new Map();list.forEach((st,s)=>{const k=areaKey(st,P.opt.areaN);if(k){if(!ids.has(k))ids.set(k,ids.size+1);areaId[s]=ids.get(k)}})}

  list.forEach((st,s)=>{
    const n=Math.max(1,+st.slots||1);let own=[];
    for(let di=0;di<D;di++)for(let si=0;si+n<=L;si++){
      if(limit17&&isLate(SL[si]))continue;
      let ok=true;for(let j=0;j<n;j++){if(occ[di*L+si+j]||!slotOK(st,dates[di]+'|'+SL[si+j].key)){ok=false;break}}
      if(ok)own.push([di,si]);

    const an=links[s].anchors;
    if(an.length){const f=own.filter(([di,si])=>!an.some(a=>a.di===di&&si<a.si+a.n&&a.si<si+n));if(f.length)own=f}
    for(const [di,si] of own){const id=cs.length;cs.push(s);cst.push(di*L+si);clen.push(n);cdi.push(di);csi.push(si);sc[s].push(id)}
  });

}

/* ---- search (generator so the UI stays responsive) ---- */

  if(need>free)return false;

  const mkTime=()=>{const idx=pb.SL.map((_,i)=>i);let early=idx,late=[];if(eff){early=idx.filter(i=>!isLate(pb.SL[i]));late=idx.filter(i=>isLate(pb.SL[i]))}
    const proc=a=>{a=a.slice();if(cfg.shuffle>0)shuffleArr(a,rand);if(cfg.target>=0)a.sort((x,y)=>Math.abs(x-cfg.target)-Math.abs(y-cfg.target));return a};
    const ord=proc(early).concat(proc(late));const r=new Int32Array(L);ord.forEach((si,i)=>r[si]=i);return r};

  const place=c=>{const s=cs[c];assigned[s]=c;for(let j=0;j<clen[c];j++)cellArea[cst[c]+j]=aId[s];dayCount[cdi[c]]++;free-=clen[c];need-=clen[c];let ok=true;const base=cst[c],n=clen[c];

const newCtl=(deadline,maxNodes)=>({nodes:0,bestDepth:0,bestAssign:null,solution:null,stop:false,deadline,maxNodes,timedOut:false,abort:false,capped:false});


/* best-effort: place as many students as possible (used when no full solution exists) */
function greedyPartial(pb){
  const{nC,cs,cst,clen,csi,cdi,sc,list,D,L}=pb,nS=list.length;
  const inc=Array.from({length:D*L},()=>[]);for(let c=0;c<nC;c++)for(let j=0;j<clen[c];j++)inc[cst[c]+j].push(c);
  const alive=new Uint8Array(nC).fill(1),cnt=Int32Array.from(sc.map(a=>a.length)),assigned=new Int32Array(nS).fill(-1);
  for(;;){
    let s=-1,b=1e9;for(let i=0;i<nS;i++)if(assigned[i]<0&&cnt[i]>0&&cnt[i]<b){b=cnt[i];s=i}
    if(s<0)break;
    let best=-1,bk=1e12;for(const c of sc[s])if(alive[c]){const k=csi[c]*D+cdi[c];if(k<bk){bk=k;best=c}}
    assigned[s]=best;
    for(let j=0;j<clen[best];j++)for(const k of inc[cst[best]+j])if(alive[k]){alive[k]=0;cnt[cs[k]]--}
  }

}

/* ---- scoring & diagnosis ---- */
function scoreOf(pb,assign){
  const o=pb.o,eff=P.sched.cutMode==='effort',D=pb.D,dc=new Array(D).fill(0);let late=0,tsum=0,sib=0,n=0;
  const tgt=o.target?pb.SL.findIndex(x=>x.key===o.target):-1;
  const pos=s=>{const c=assign[s];return c<0?null:{di:pb.cdi[c],si:pb.csi[c],n:pb.clen[c]}};
  const sg=+P.opt.sibGap||0;const gapPen=(a,b)=>{if(a.di!==b.di)return 60;if(a.si<b.si+b.n&&b.si<a.si+a.n)return 500;return Math.abs(Math.max(a.si-(b.si+b.n),b.si-(a.si+a.n),0)-sg)*5};
  for(let s=0;s<pb.list.length;s++){const p=pos(s);if(!p)continue;n++;dc[p.di]++;if(eff&&isLate(pb.SL[p.si]))late++;if(tgt>=0)tsum+=Math.abs(p.si-tgt);

    for(const arr of byDay.values()){arr.sort((x,y)=>x.si-y.si);for(let i=1;i<arr.length;i++){if(arr[i].si===arr[i-1].si+arr[i-1].n&&arr[i].a!==arr[i-1].a)sib+=6}}}
  for(const g of pb.areaGroups){const pts=g.map(pos).filter(Boolean).sort((a,b)=>a.di-b.di||a.si-b.si);for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];if(a.di!==b.di)sib+=40;else{const gap=b.si-(a.si+a.n);if(gap>0)sib+=gap*8}}}

  const SL=pb.SL,rows=pb.list.map((st,s)=>({st,n:pb.sc[s].length,len:Math.max(1,+st.slots||1)})).sort((a,b)=>a.n-b.n);

/* ---- orchestration ---- */
async function solveClass(clsKey,o,hooks={}){
  const eff=P.sched.cutMode==='effort',t0=performance.now(),total=Math.max(5,+o.maxSec||20)*1000;
  const tgt=o.target?getSlots().findIndex(x=>x.key===o.target):-1;
  const base={shuffle:+o.shuffle||0,balance:!!o.balance,target:tgt,strategy:'mrv'};
  const seed=(+o.shuffle===1)?1:(Date.now()&0xffffff);
  const full=buildProblem(clsKey,o,false,o.exclude);
  if(!full.list.length)return{status:'empty',pb:full};
  const dead=full.list.filter((_,s)=>full.sc[s].length===0);
  if(dead.length)return{status:'deadlock',dead,pb:full,diag:diagnose(full)};
  const tick=c=>hooks.tick&&hooks.tick(c,full.list.length);
  let pb=full,limit=false,ctl,sol=null,nodes=0;
  if(eff){
    const p1=buildProblem(clsKey,o,true,o.exclude);
    if(p1.list.every((_,s)=>p1.sc[s].length>0)){
      hooks.stage&&hooks.stage(`${P.sched.cutTime}までの枠で探しています`);
      ctl=newCtl(t0+Math.min(2500,total/3));const r=await runGen(searchGen(p1,{...base,rand:mulberry(seed)},ctl),ctl,tick);nodes+=ctl.nodes;
      if(r){pb=p1;limit=true;sol=ctl.solution}else if(ctl.abort)return{status:'abort',pb:full};
    }
  }
  if(!sol){
    hooks.stage&&hooks.stage(eff?`${P.sched.cutTime}以降の枠も使って探しています`:'配置を探しています');
    ctl=newCtl(t0+total);const r=await runGen(searchGen(full,{...base,rand:mulberry(seed)},ctl),ctl,tick);nodes+=ctl.nodes;
    if(r){sol=ctl.solution;pb=full}
    else{
      const g=greedyPartial(full),gc=g.filter(x=>x>=0).length,bc=ctl.bestAssign?ctl.bestAssign.filter(x=>x>=0).length:0;
      const partial=gc>=bc?g:ctl.bestAssign;
      return{status:ctl.abort?'abort':'fail',pb:full,partial,bestDepth:Math.max(gc,bc),timedOut:ctl.timedOut,diag:diagnose(full)};
    }
  }
  let best=sol,bs=scoreOf(pb,best);const first=bs;
  if((+o.refine>0)&&bs>0){
    hooks.stage&&hooks.stage('配置を仕上げています');
    const end=performance.now()+o.refine*1000;let i=0,stale=0;
    while(performance.now()<end&&bs>0&&stale<40&&!AUTO.abort){
      const c2=newCtl(end,40000);const r=await runGen(searchGen(pb,{...base,shuffle:Math.max(1,base.shuffle),rand:mulberry(seed+1000+i++)},c2),c2,tick);nodes+=c2.nodes;
      if(r){const sc2=scoreOf(pb,c2.solution);if(sc2<bs){bs=sc2;best=c2.solution;stale=0}else stale++}else stale++;
    }
  }
  return{status:'ok',pb,assign:best,limit17:limit,score:bs,firstScore:first,nodes,ms:performance.now()-t0};
}
function applyResult(res,lock=true){
  const pb=res.pb,cls=pb.cls,o=pb.o;

    if(!o.keep)for(const st of members(pb.clsKey))clearPlace(cls,st.id);
    let n=0;res.placedSids=[];pb.list.forEach((st,s)=>{const c=(res.assign||res.partial)[s];if(c<0)return;putPlace(cls,st,pb.dates[pb.cdi[c]]+'|'+pb.SL[pb.csi[c]].key,false);res.placedSids.push(st.id);n++});

/* ---- puzzle-fill animation (visible class only): random order, trial-and-error, finale ---- */
function startAnim(clsKey,sids){
  const cls=P.classes[clsKey],SL=getSlots(),dates=P.sched.dates,rnd=Math.random;
  const empties=[];for(const d of dates)for(const x of SL){const k=d+'|'+x.key;if(!cls.grid[k])empties.push(k)}
  const decoyFor=sid=>{const st=stById(sid);if(!st||(+st.slots||1)>1)return null;const c=empties.filter(k=>slotOK(st,k));return c.length?c[Math.floor(rnd()*c.length)]:null};
  const q=sids.slice().sort(()=>rnd()-.5),ops=[],placed=[];
  let events=sids.length>=6?(sids.length>=14?(rnd()<.5?1:2):1):0,nextAt=Math.max(3,Math.floor(sids.length*.22)),shown=0;

      }else if(placed.length>=5){ // already-placed ones are taken back, others go first
        const k=Math.min(placed.length-1,3+Math.floor(rnd()*4)),back=placed.splice(placed.length-k,k);
        for(const sid of back)ops.push({t:'recallStart',sid,w:.2});ops.push({t:'pause',w:.7});for(const sid of back)ops.push({t:'recallEnd',sid,w:.1});
        shown-=back.length;q.splice(Math.min(q.length,2+Math.floor(rnd()*4)),0,...back.sort(()=>rnd()-.5));
      }
      events--;nextAt=shown+Math.max(3,Math.floor(sids.length*.2));continue;
    }
    const sid=q.shift();ops.push({t:'show',sid,w:1});placed.push(sid);shown++;
  }
  const FIX={try:80,trashStart:190,trashEnd:30,recallStart:160,recallEnd:30},nShow=ops.filter(o=>o.t==='show').length||1;
  const showMs=Math.max(18,Math.min(1300,Math.max(800,sids.length*28))/nShow);let cur=0;
  for(const o of ops){o.at=cur;cur+=o.t==='show'?showMs:(o.t==='pause'?o.w*260:FIX[o.t])}

function runAnim(an){
  an.t0=performance.now();const skip=()=>{an.skip=true};window.addEventListener('pointerdown',skip,true);window.addEventListener('keydown',skip,true);const unskip=()=>{window.removeEventListener('pointerdown',skip,true);window.removeEventListener('keydown',skip,true)};
  const step=()=>{
    if(UI.grid.anim!==an){an.done();return}
    const el=an.skip?1e9:performance.now()-an.t0;let ch=false;an.just=new Set();
    while(an.i<an.ops.length&&an.ops[an.i].at<=el){const o=an.ops[an.i++];ch=true;
      if(o.t==='show'){an.hidden.delete(o.sid);an.just.add(o.sid)}
      else if(o.t==='try')an.decoys.set(o.sid,o.key);
      else if(o.t==='trashStart'||o.t==='recallStart')an.shake.add(o.sid);
      else if(o.t==='trashEnd'){an.decoys.delete(o.sid);an.shake.delete(o.sid)}
      else if(o.t==='recallEnd'){an.hidden.add(o.sid);an.shake.delete(o.sid)}}
    if(ch)renderNow();
    if(an.i<an.ops.length||el<an.dur)requestAnimationFrame(step);
    else{unskip();an.hidden.clear();an.decoys.clear();an.shake.clear();UI.grid.anim=null;renderNow();an.done()}
  };
  requestAnimationFrame(step);
}

}

/* ---------- datetime parsing ---------- */
const DT_RE=/^(?:(\d{4})\s*[年\-\/.]\s*)?(\d{1,2})\s*[月\-\/.]\s*(\d{1,2})\s*日?\s*[\sT]*(\d{1,2})\s*[:時]\s*(\d{2})?/;
function parseDT(tok,tsYear,tsDate){

  let y=m[1]?+m[1]:null;const mo=+m[2],d=+m[3],h=+m[4],mi=m[5]?+m[5]:0;
  if(mo<1||mo>12||d<1||d>31||h>47||mi>59)return null;
  if(y==null){
    const cand=P.sched.dates.find(x=>{const p=dp(x);return p.m===mo&&p.d===d});
    if(cand)y=dp(cand).y;else{y=tsYear||new Date().getFullYear();if(tsDate){const dt=new Date(y,mo-1,d);if(dt-tsDate<-150*864e5)y++}}
  }
  return{iso:`${y}-${pad(mo)}-${pad(d)}`,time:pad(h)+':'+pad(mi),min:h*60+mi};
}
const splitToks=s=>String(s??'').split(/[,、，;\n\r]+/).map(x=>x.trim()).filter(Boolean);
function parseTs(v){
  if(v instanceof Date)return v.getTime();
  if(typeof v==='number'&&v>20000)return Math.round((v-25569)*864e5);
  const s=String(v??'').normalize('NFKC').trim();if(!s)return null;
  const m=/^(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})日?\s*(?:(\d{1,2}):(\d{2})(?::(\d{2}))?)?/.exec(s);
  if(m)return new Date(+m[1],+m[2]-1,+m[3],+(m[4]||0),+(m[5]||0),+(m[6]||0)).getTime();
  const t=Date.parse(s);return isNaN(t)?null:t;
}
const isBlankish=s=>{s=String(s??'').normalize('NFKC').trim();return !s||/^[○●◯◎×✕✖\-－ー—–・.\s]*$/.test(s)||/^(なし|無し|無|いない|該当なし|特になし|ありません|0)$/.test(s)};
function parseGC(s){
  s=String(s??'').normalize('NFKC').trim();if(isBlankish(s))return null;
  const m=/(\d+)\s*[年\-\/・]\s*([0-9A-Za-zＡ-Ｚ]+)/.exec(s);if(!m)return null;
  return{g:+m[1],c:/^\d+$/.test(m[2])?String(+m[2]):m[2]};
}
const num=v=>{const t=String(v??'').normalize('NFKC').replace(/[^0-9]/g,'');return t?parseInt(t,10):NaN};

/* ---------- column detection ---------- */
function detectCols(hdr,rows){
  const col={sibs:{}};
  hdr.forEach((h,i)=>{
    const t=String(h??'').normalize('NFKC').replace(/\s/g,'');
    const m=/(?:きょうだい|兄弟|姉妹)(\d+)[:：]?(.*)/.exec(t);
    if(m){const o=col.sibs[+m[1]]||(col.sibs[+m[1]]={}),sub=m[2];
      if(/ふりがな|ひらがな|フリガナ|よみ/.test(sub))o.kana=i;else if(/氏名|名前|なまえ/.test(sub))o.name=i;else if(/学年.*組/.test(sub))o.gc=i;else if(/学年/.test(sub))o.g=i;else if(/組/.test(sub))o.c=i;else if(/番/.test(sub))o.n=i;return}
    if(/タイムスタンプ|timestamp/i.test(t)){col.ts??=i;return}
    if(/^学年$/.test(t)){col.g??=i;return}
    if(/^組$/.test(t)){col.c??=i;return}
    if(/出席番号|^番号$|^番$/.test(t)){col.n??=i;return}
    if(/住所|地区|町名/.test(t)){col.addr??=i;return}
    if(/ふりがな|ひらがな|なまえ|フリガナ|よみ/.test(t)){col.kana??=i;return}
    if(/氏名|生徒名|児童|名前/.test(t)){col.name??=i;return}
    if(/希望について/.test(t)){col.k??=i;return}
  });
  const used=new Set([col.ts,col.g,col.c,col.n,col.kana,col.name,col.k,col.addr,...Object.values(col.sibs).flatMap(o=>Object.values(o))]);
  let best=-1,bs=0;const body=rows.slice(1,400);
  for(let i=0;i<hdr.length;i++){if(used.has(i))continue;let ne=0,ok=0;for(const r of body){const v=r[i];if(v==null||String(v).trim()==='')continue;ne++;if(splitToks(v).some(x=>DT_RE.test(String(x).normalize('NFKC'))))ok++}
    const sc=ne?ok/ne:0;if(sc>bs&&ok>=2){bs=sc;best=i}}
  if(best>=0)col.dt=best;
  return col;
}

  if(col.g==null||col.c==null||col.n==null)throw new Error('「学年」「組」「出席番号」の列が見つかりません。1行目が見出しになっているか確認してください');

    const toks=[],bad=[];
    if(col.dt!=null)for(const tk of splitToks(cell(r,col.dt))){const p=parseDT(tk,tsd&&tsd.getFullYear(),tsd);if(p)toks.push(p);else bad.push(tk)}

    for(const k of Object.keys(col.sibs).sort((a,b)=>a-b)){
      const o=col.sibs[k];const name=isBlankish(cell(r,o.name))?'':String(cell(r,o.name)).trim();
      let gc=o.gc!=null?parseGC(cell(r,o.gc)):null;if(!gc&&o.g!=null&&o.c!=null){const gg=num(cell(r,o.g));const cc=String(cell(r,o.c)??'').replace(/組$/,'').trim();if(!isNaN(gg)&&cc)gc={g:gg,c:cc}}
      const nn=o.n!=null&&!isBlankish(cell(r,o.n))?num(cell(r,o.n)):NaN;
      const skana=o.kana!=null&&!isBlankish(cell(r,o.kana))?String(cell(r,o.kana)).trim():'';if(!name&&!gc&&!skana)continue;sibs.push({name,kana:skana,g:gc?gc.g:'',c:gc?gc.c:'',n:isNaN(nn)?'':nn});
    }

/* ---------- apply ---------- */
function applyPlan(plan,o){

      const nc={};for(const k of V)nc[k]={v:'u',s:'i'};setProp(st,'cond',nc);nUn++}}
    /* reverse sibling links (rebuild) */
    for(const s of P.students){if((s.sib||[]).some(b=>b.src==='r'))setProp(s,'sib',s.sib.filter(b=>b.src!=='r'))}
    for(const s of P.students)for(const b of s.sib||[]){if(b.src!=='i')continue;const m=sibFind(b);if(!m||m===s)continue;
      const has=(m.sib||[]).some(x=>{const f=sibFind(x);return f===s});
      if(!has)setProp(m,'sib',(m.sib||[]).concat([{name:s.name,g:String(s.g),c:String(s.c),n:String(s.n),note:'',src:'r'}]))}
    setProp(P,'imp',{at:Date.now(),file:plan.file,n:targets.length});
  });
  return{applied:targets.length,nCond,nFree,nSib,nUn};
}
function logCsv(plan,o){
  const rows=[['状態','学年','組','番','名前（回答）','ふりがな（回答）','メモ']];
  const g=(s,r,m)=>rows.push([s,r.g,r.c,r.n,r.name,r.kana,m||'']);
  for(const m of plan.matched)g('反映済',m.r,(plan.dupKeys.includes(m.r.g+'|'+m.r.c+'|'+m.r.n)?'重複回答あり（最新を採用）':'')+(m.diff&&m.diff.num?`番号が違います（名簿：${m.st.n}番）`:'')+(m.diff&&m.diff.kanji?'／漢字が違います':'')+(m.diff&&m.diff.kana?'／ふりがなが違います':'')+(m.r.free&&m.r.toks.length?'いつでも可と日時指定が両方あります（日時指定を採用）':''));
  for(const x of plan.numOnly)g(o.acceptNum.has(x.r.row)?'反映済（番号のみ一致）':'名前不一致',x.r,`名簿：${x.st.n}番 ${x.st.name}${x.amb?'（同じ読みの子が複数）':''}${x.conflict&&!x.amb?'（別の回答と重複）':''}`);
  for(const x of plan.none)g('名簿に該当なし',x.r,'');
  for(const s of plan.unans)rows.push(['未回答',s.g,s.c,s.n,s.name,s.kana,'']);
  for(const b of plan.badDT)rows.push(['日時が読めない',b.g,b.c,b.n,'','',b.bad.join(' / ')]);
  return '\uFEFF'+rows.map(r=>r.map(c=>{c=String(c??'');return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')).join('\r\n');
}

      <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px">${p.extraDates.length&&P.sched.dates.length?`<label class="tog"><input type="checkbox" data-ch="imp-dates" ${o.adoptDates?'checked':''}>日程に、回答にある日付を追加する</label>`:''}${p.extraTimes.length&&p.derived&&P.sched.dates.length?`<label class="tog"><input type="checkbox" data-ch="imp-times" ${o.adoptTimes?'checked':''}>時間割を回答に合わせる（${p.derived.start}から${p.derived.slotMin}分×${p.derived.slotCount}枠）</label>`:''}${!P.sched.dates.length?'<span class="muted">日程が空なので、回答から日程を作ります。</span>':''}</div>`,true);
  }
  h+=`<div class="row" style="margin-top:12px;flex-direction:column;align-items:flex-start;gap:6px"><label class="tog"><input type="checkbox" data-ch="imp-keep" ${P.opt.keepManual?'checked':''}>手で直した都合は消さない（おすすめ）</label><label class="tog"><input type="checkbox" data-ch="imp-un" ${o.markUnans?'checked':''}>回答のない児童生徒を「未」にする（自動配置の対象外になります）</label></div>

  return h;
}

function printTargets(){

  for(const c of all){if(!U.sel.has(c.key))continue;const cls=P.classes[c.key];

// 条件ブロック：1学級あたり2枚（または指定枚数）に収めたとき、文字が最大になる向きを選ぶ
function blocksBestOrient(size){
  const U=UI.print,key=[VER,size,U.pages,docClassList().map(c=>c.key).join(','),getSlots().length,P.sched.dates.length].join('|');
  if(BO.k===key)return BO.v;
  const [a,b]=PAPERS[size]||PAPERS.A3,D=P.sched.dates.length,L=getSlots().length,np=(U.pages==='auto'||!+U.pages)?2:+U.pages;
  const score=(W,H)=>{let m=Infinity;for(const c of docClassList()){const N=members(c.key).length;if(!N)continue;const lay=blockLayout(Math.ceil(N/np),W-12,H-12-9,D,L);m=Math.min(m,lay?lay.sc:0)}return m===Infinity?0:m};
  const v=score(b,a)>=score(a,b)?'l':'p';BO={k:key,v};return v;
}

const TCACHE=new Map();
function measureEl(html,W=297){

function tableSheet(c,W=297,H=210){
  const U=UI.print,AD=pAddrDoc(),SM=U.sibMode||'out',kk_=Math.max(1,Math.min(W/297,H/210)),ck=VER+'|'+AD+'|'+SM+'|'+W+'x'+H+'|'+c.key+'|'+getSlots().length+'|'+P.sched.dates.join(',');
  if(TCACHE.has(ck))return TCACHE.get(ck);
  const cls=P.classes[c.key],dates=P.sched.dates,SL=getSlots(),mem=members(c.key);
  let first=-1,last=-1;SL.forEach((x,i)=>{for(const d of dates){const cc=cls.grid[d+'|'+x.key];if(cc){if(first<0)first=i;last=i}}});
  if(first<0){first=0;last=Math.min(SL.length-1,9)}
  const rows=SL.slice(first,last+1);
  const heads=new Map();
  rows.forEach(x=>{for(const d of dates){const k=d+'|'+x.key,cc=cls.grid[k];if(!cc||!cc.head)continue;const st=stById(cc.sid);if(st)heads.set(k,{n:cc.n||1,st,sib:sibLines(st)})}});
  const availH=H-16-20.5-9;   // table (+ sibling list) must fit in this many mm
  const unpl=mem.filter(s=>!headKey(cls,s.id));
  const range=dates.length?`${mdw(dates[0])}${dates.length>1?' 〜 '+mdw(dates[dates.length-1]):''}`:'';
  const inCell=SM!=='out',outList=SM!=='in';
  const pairs=[],seen=new Set();                                   // きょうだい一覧（表の外）
  for(const st of mem){for(const b of st.sib||[]){const m=sibFind(b);
    if(m&&m.g+'|'+m.c===c.key){const kx=[st.id,m.id].sort().join('~');if(seen.has(kx))continue;seen.add(kx)}
    const lab=m?`${clsLabel(m.g,m.c)} ${m.name}　${placeText(m)||'日時未定'}`:((b.name||b.g)?`${b.g?b.g+'年'+b.c+'組 ':''}${b.name||''}（名簿になし）`:'');
    if(lab)pairs.push(`<b>${esc(st.name)}</b>（${esc(placeText(st)||'日時未定')}）⇄ ${esc(lab)}`)}}
  const build=(fn,fs,wa,sn,tabH)=>{

      for(const d of dates){const k=d+'|'+x.key;if(skip.has(k))continue;const cc=cls.grid[k];
        if(!cc){body+='<td class="e"></td>';continue}
        if(cc.brk){body+='<td class="b">休憩</td>';continue}
        const h=heads.get(k);if(!h){body+='<td class="e"></td>';continue}
        for(let j=1;j<h.n;j++){const s2=SL[first+ri+j];if(s2)skip.add(d+'|'+s2.key)}
        const st=h.st,hs=h.sib.length>0;
        body+=`<td class="h${hs?' sbc':''}" rowspan="${h.n}"><div class="nm nmfont" style="font-size:${fn}pt"><span class="t">${esc(st.name)}</span><span class="no">${st.n}</span>${hs?'<span class="star">★</span>':''}</div>${wa&&st.addr?`<div class="ad" style="font-size:${fs}pt">${esc(st.addr)}</div>`:''}${inCell?h.sib.slice(0,sn).map(l=>`<div class="sb sbr" style="font-size:${fs}pt">★きょうだい ${esc(l)}</div>`).join(''):''}${h.n>1?`<div class="sb" style="font-size:${fs}pt">${h.n}枠</div>`:''}</td>`;
      }

    const list=outList&&pairs.length?`<div class="sbl" style="font-size:${clamp(fs*1.05,6,10*kk_)}pt"><div class="sh">★ きょうだい（赤字の児童生徒）</div>${pairs.map(x=>`<div class="sl1">${x}</div>`).join('')}</div>`:'';
    return `<section class="dsheet land" style="width:${W}mm;height:${H}mm"><div class="dh"><div class="dcr">かこピタ v.${APP_VER}　Created by ${esc(APP_AUTHOR)}</div><div class="dh1"><b>${esc(clsLabel(c.g,c.c))}</b>　${esc(kindName())} 日程表<span class="dh2">${c.teacher?esc(c.teacher)+' 先生':''}　${esc(range)}　${esc(P.meta.school||'')}</span></div></div>
     <table class="ttab" style="${tabH?`height:${tabH}mm`:'height:auto'}"><thead><tr><th class="tm"></th>${dates.map(d=>`<th>${mdw(d)}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>${list}
     <div class="dfoot">${unpl.length?`日時が決まっていない児童生徒：${unpl.map(s=>esc(s.name)).join('、')}`:'全員の日時が決まっています'}　／　${mem.length}名${wa!==AD?'　（紙面に収めるため住所を省略しました）':''}</div></section>`;
  };
  let out=null;
  outer:for(const [wa,sn] of [[AD,9],[AD,2],[false,2],[false,1]]){
    for(let f=17*kk_;f>=6.5;f-=(f>17?1:.5)){const fs=clamp(f*.58,5.6,9.5*kk_);
      const m=measureEl(build(f,fs,wa,sn,0),W);
      if(m.h<=availH&&!m.over){out=build(f,fs,wa,sn,Math.max(10,availH-m.lh));break outer}}
  }
  if(!out)out=build(6.5,5.6,false,1,0);
  if(TCACHE.size>40)TCACHE.clear();TCACHE.set(ck,out);return out;
}

/* ---- ② 条件ブロック ---- */
function blockLayout(K,pw,ph,D,L){
  // choose columns x rows for K blocks to make the matrix cells as large as possible
  let best=null;for(let C=1;C<=10;C++){const R=Math.ceil(K/C);if(R>10)continue;
    const bw=pw/C,bh=ph/R,mw=bw-3-6.5,mh=bh-7-3.4-8;if(mw<=0||mh<=0)continue;
    const cw=mw/D,ch=mh/L,sc=Math.min(cw/4.2,ch/3.1);if(!best||sc>best.sc)best={C,R,bw,bh,cw,ch,sc}}
  return best;
}
function blocksSheets(c){
  const U=UI.print,cls=P.classes[c.key],dates=P.sched.dates,SL=getSlots(),mem=members(c.key),[W,H]=paperWH('blocks');
  const pw=W-12,ph=H-12-9,D=dates.length,L=SL.length,N=mem.length;
  let P_=U.pages==='auto'?0:+U.pages;
  if(!P_){for(let p=1;p<=6;p++){const lay=blockLayout(Math.ceil(N/p),pw,ph,D,L);if(lay&&lay.sc>=1){P_=p;break}}if(!P_)P_=6}
  const K=Math.ceil(N/P_),lay=blockLayout(K,pw,ph,D,L);if(!lay)return [];
  const gf=clamp(Math.min(lay.cw*.62,lay.ch*.8)*2.83,5,12),nf=clamp(lay.bh*.095*2.83*.8,7,12);
  const pages=[];
  for(let p=0;p<P_;p++){
    const part=mem.slice(p*K,(p+1)*K);if(!part.length)break;
    const blocks=part.map(st=>{
      const un=stStatus(st)==='unans',pt=U.showPlace?placeText(st):'',sb=sibLines(st);
      const head=SL.map(()=>0);
      return `<div class="cb" style="${colorExact}"><div class="cbh"><b class="nmfont" style="font-size:${nf}pt"><span class="no">${st.n}</span> ${esc(st.name)}</b>${st.slots>1?`<span class="cbs">${st.slots}枠</span>`:''}${un?'<span class="cbs u">未回答</span>':''}${pAddrDoc()&&st.addr?`<span class="cba" style="font-size:${Math.max(5.5,nf*.62)}pt">${esc(st.addr)}</span>`:''}</div>
       <table class="cbt"><thead><tr><th></th>${dates.map(d=>`<th style="font-size:${Math.max(5,gf*.72)}pt">${dp(d).d}${WD[dp(d).wd]}</th>`).join('')}</tr></thead><tbody>${SL.map(x=>`<tr><th style="font-size:${Math.max(4.6,gf*.7)}pt">${x.label}</th>${dates.map(d=>{const cc=st.cond[d+'|'+x.key],v=cc?cc.v:'';return `<td class="${v}" style="font-size:${gf}pt">${v==='x'?'×':v==='o'?'○':v==='u'?'未':''}</td>`}).join('')}</tr>`).join('')}</tbody></table>
       <div class="cbf" style="font-size:${Math.max(5.5,nf*.62)}pt">${pt?`<span>配置 ${esc(pt)}</span>`:''}${sb.slice(0,2).map(l=>`<span class="sbr">★きょうだい ${esc(l)}</span>`).join('')}</div></div>`}).join('');
    pages.push(`<section class="dsheet blk" style="width:${W}mm;height:${H}mm"><div class="bh"><b>${esc(clsLabel(c.g,c.c))}　条件ブロック</b>　<span>×＝不可　○＝この時間のみ可　未＝未回答</span><span class="bpg">${p+1}/${P_}　${esc(kindName())}</span></div><div class="bgrid" style="grid-template-columns:repeat(${lay.C},1fr);grid-template-rows:repeat(${lay.R},1fr);height:${ph}mm">${blocks}</div></section>`);
  }
  return pages;
}
